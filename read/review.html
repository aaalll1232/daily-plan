<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>摘抄复盘 · 申论晨读</title>

<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#1B2430;--sub:#7A869A;--line:#EAEEF4;
--brand:#1F3864;--brand2:#3A6EAF;--accent:#2E9E6B;--warn:#C0563B;--r:16px;
--sh:0 2px 10px rgba(24,40,70,.06);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 0}
.hero{background:linear-gradient(135deg,#24406E,#1F3864);color:#fff;border-radius:20px;
padding:16px 18px;box-shadow:0 6px 18px rgba(31,56,100,.22);margin-bottom:12px}
.hero .d1{font-size:13px;opacity:.85;letter-spacing:.5px}
.hero .d2{font-size:20px;font-weight:700;margin-top:2px}
.hero .d3{font-size:12.5px;opacity:.82;margin-top:5px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:10px 6px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--brand);line-height:1.2}
.stat span{font-size:11.5px;color:var(--sub)}
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:12px}
.panel .pt{font-size:13.5px;font-weight:700;color:var(--brand);margin-bottom:8px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;background:#EAF2FB;color:var(--brand2);border-radius:16px;padding:5px 12px;
font-size:12.5px;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);color:#fff}
.chip i{font-style:normal;opacity:.65;margin-left:3px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{background:#fff;border:1px solid var(--line);color:var(--brand);border-radius:18px;
padding:7px 13px;font-size:13px;font-weight:600;font-family:inherit;box-shadow:var(--sh);cursor:pointer}
.btn:active{background:#EEF2F8}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=search]{flex:1;min-width:150px;border:1px solid var(--line);border-radius:18px;
padding:7px 13px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff}
.it{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:13px 15px;margin-bottom:10px;
border-left:4px solid var(--brand2)}
.it.used{opacity:.5;border-left-color:#C9D2E0}
.it.phrase{border-left-color:#E5A23C}
.it .tx{font-size:15.3px;line-height:1.85;color:#243247}
.it.phrase .tx{font-size:14.5px;color:#5A4A1E}
.it .mt{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}
.tag{display:inline-block;background:#EAF2FB;color:var(--brand2);border-radius:6px;
padding:1px 7px;font-size:12px;font-weight:700}
.tag.big{background:var(--brand);color:#fff}
.tag.sm{background:#F2F5F9;color:#8A94A6;font-weight:500;font-size:11.5px}
.it .dt{font-size:11.5px;color:var(--sub)}
.it .src{font-size:11.5px;color:var(--sub);font-style:italic}
.ibtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:14px;
padding:3px 11px;font-size:12px;color:var(--brand);font-family:inherit;cursor:pointer;white-space:nowrap}
.ibtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ibtn.say{color:var(--brand2)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:24px 0}
.foot{text-align:center;font-size:12px;color:var(--sub);padding:6px 0 20px;line-height:1.7}
.draw{background:#FFF8E8;border-left:4px solid #E5A23C;border-radius:0 12px 12px 0;
padding:11px 13px;font-size:13px;color:#5A4A1E;margin-bottom:12px;line-height:1.7;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="d1">摘抄复盘 · 把抄过的变成能用的</div>
    <div class="d2">按主题翻 · 标用过 · 随机抽背</div>
    <div class="d3">「未用过」的句子才是你考前真正要背的。写进过作文的点一下「标为已用」，剩下就是漏洞。</div>
  </div>

  <div class="stats">
    <div class="stat"><b id="s1">0</b><span>累计</span></div>
    <div class="stat"><b id="s2">0</b><span>已用</span></div>
    <div class="stat"><b id="s3">0</b><span>未用</span></div>
    <div class="stat"><b id="s4">0</b><span>近7天</span></div>
  </div>

  <div class="draw" id="draw">🎲 抽签模式：下面 5 句是随机抽的，背完点「标为已用」，再抽下一组。</div>

  <div class="panel">
    <div class="pt">按大类复盘（数字 = 未用 / 总数）</div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="btn" id="bu" onclick="setUnused(!onlyUnused)">只看未用过</button>
      <button class="btn" id="dbtn" onclick="drawMode?drawMode=false,render():draw()">随机抽 5 句</button>
    </div>
    <div class="row">
      <input type="search" placeholder="搜句子或主题关键字…" oninput="setKw(this.value)">
    </div>
    <div class="row">
      <span class="dt" style="font-size:11.5px;color:var(--sub)">当前显示 <b id="cnt">0</b> 条 · 库内共 1294 条（页面只放最近 120 天）</span>
    </div>
  </div>

  <div id="list"></div>

  <div class="panel">
    <div class="pt">标记备份（换手机 / 清缓存不丢）</div>
    <div class="row">
      <button class="btn" onclick="exportUsed()">导出已用清单</button>
      <label class="btn" style="position:relative;overflow:hidden">导入恢复
        <input type="file" accept=".json" style="position:absolute;left:0;top:0;opacity:0;width:100%;height:100%"
               onchange="importUsed(this)"></label>
      <a class="btn" style="text-decoration:none" href="index.html">← 今日晨读包</a>
    </div>
  </div>

  <div class="foot">摘抄库随每日晨读包自动累积 · 更新于 2026-11-07 23:43<br>
  标记存在本机浏览器里，换设备记得先导出</div>
</div>

 "big": "政绩观·党性修养", "topics": ["政绩观"], "text": "业有远近，功有潜显。（《深耕潜绩 固本致远（思想纵横）》，《人民日报》2026年10月28日 09 版）", "src": ""}, {"id": "b170d58cee", "date": "2026-10-29", "type": "短语", "big": "政绩观·党性修养", "topics": ["久久为功"], "text": "夯基垒台之功，虽不显于一时，终会推动事业向前发展；潜修实干之绩，虽不耀于当下，定会化为群众口碑和事业丰碑。", "src": "同上"}, {"id": "848df8e9f2", "date": "2026-10-29", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作"], "text": "在矛盾最集中的地方破题，在基础最薄弱的地方筑基，在人民最期盼的地方发力。", "src": "同上"}, {"id": "fb8f08740e", "date": "2026-10-29", "type": "短语", "big": "方法论·万能句", "topics": ["久久为功"], "text": "很多伟大的事情，并不是因为开始时就伟大，而是在长期认真坚持中变得伟大。（程诚《沉潜者，时间终有回响（暖闻热评）》，《人民日报》2026年10月28日 05 版）", "src": ""}, {"id": "9af3da095f", "date": "2026-10-29", "type": "短语", "big": "文化·精神·文明", "topics": ["精神文明"], "text": "一个社会的文明程度，最终体现在个体能否在走出私域后，对他人、公共规则保持敬畏与尊重。（《文明养成需守&quot;公私之界&quot;（人民锐评）》，《人民日报》2026年10月28日 05 版）", "src": ""}, {"id": "b1e0fcc66b", "date": "2026-10-29", "type": "短语", "big": "治理·法治·安全", "topics": ["法治"], "text": "文明素养的提升、公私边界的厘清，不能仅靠道德自觉，更需要清晰的规则引导与制度规范。", "src": "同上"}, {"id": "2707697d25", "date": "2026-10-29", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新"], "text": "技术可以革新图像生产的方式，却不能代替人对世界的感知。（马佳伟《目光交汇，与美相遇（金台随笔）》，《人民日报》2026年10月28日 05 版）", "src": ""}, {"id": "795476f45a", "date": "2026-10-28", "type": "金句", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "时代在不断前进、事业在不断发展，理论创新和实践创新一刻也不能停止。", "src": "习近平（转引自《思想如炬，照亮新的赶考路》，《人民日报》2026年10月27日 01 版）"}, {"id": "ab93a71b4f", "date": "2026-10-28", "type": "金句", "big": "生态文明·绿色发展", "topics": ["生态文明"], "text": "经济要发展，但不能以破坏生态环境为代价。", "src": "习近平 2015年1月在云南考察时强调（转引自《一江碧水悟思想》，《人民日报》2026年10月27日 05 版）"}, {"id": "9bca1cf503", "date": "2026-10-28", "type": "金句", "big": "文化·精神·文明", "topics": ["传统文化"], "text": "要保护好城市历史文化遗存，延续城市文脉，使历史和当代相得益彰。", "src": "习近平（转引自《汲取我国古代城市建设治理智慧推动城市工作》，《人民日报》2026年10月27日 09 版）"}, {"id": "9eb7b1da57", "date": "2026-10-28", "type": "金句", "big": "为民·民生·基层", "topics": ["公共服务"], "text": "要进一步加强党建引领，积极探索社区党组织领导下的居委会、业委会、物业服务企业协调运行新模式，建设完整社区和便民生活圈，用心用情为居民做好事、办实事、解难事。", "src": "习近平今年7月在上海黄浦区半淞园路街道市民新村居民区调研时指出（转引自《人民日报》2026年10月27日 01 版）"}, {"id": "d95c4c7a86", "date": "2026-10-28", "type": "金句", "big": "方法论·万能句", "topics": ["久久为功"], "text": "对定下来的工作部署，要一抓到底、善始善终，坚决防止走过场、一阵风。", "src": "习近平 2015年1月在中央党校县委书记研修班谈及山西右玉治沙时强调（转引自《思想如炬，照亮新的赶考路》，01 版）"}, {"id": "b41bf630c0", "date": "2026-10-28", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "中国最大的国情就是中国共产党的领导。什么是中国特色？这就是中国特色。", "src": "张洋《思想如炬，照亮新的赶考路》，《人民日报》2026年10月27日 01 版"}, {"id": "e5155e2f2b", "date": "2026-10-28", "type": "短语", "big": "政绩观·党性修养", "topics": ["担当"], "text": "管党治党必须牵住责任制这个&quot;牛鼻子&quot;。", "src": "同上"}, {"id": "3e9f7ac1b9", "date": "2026-10-28", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "一个政党敢于刀刃向内，群众看到的是负责而非回避，是担当而非遮掩。（何昭宇《把严的基调长期坚持下去（金台潮声）》，2026年10月27日 19 版）", "src": ""}, {"id": "b1292322bd", "date": "2026-10-28", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展"], "text": "河湖新生，正是思想伟力的生动体现。（《一江碧水悟思想（评论员观察）》，2026年10月27日 05 版）", "src": ""}, {"id": "085e9be2e1", "date": "2026-10-28", "type": "短语", "big": "生态文明·绿色发展", "topics": ["精准施策"], "text": "既急不得，也慢不得，要按规律办事。", "src": "习近平谈&quot;一湖两海&quot;治理，转引自同上"}, {"id": "bf1f5b25b1", "date": "2026-10-28", "type": "短语", "big": "生态文明·绿色发展", "topics": ["生态文明"], "text": "从&quot;靠湖吃湖&quot;到生态优先，从&quot;就湖论湖&quot;到全流域治理，从&quot;九龙治水&quot;到协调统一。", "src": "同上"}, {"id": "d633c58e7c", "date": "2026-10-28", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展"], "text": "数字技术的深度应用，正在把过去无价可依的绿水青山变成有价可循的可交易资产。（叶紫薇《促进农业生态价值转化（专题深思）》，2026年10月27日 09 版）", "src": ""}, {"id": "64caebefde", "date": "2026-10-28", "type": "短语", "big": "治理·法治·安全", "topics": ["治理精度"], "text": "一个支部一个支部提升，一个阵地一个阵地巩固。", "src": "《思想如炬，照亮新的赶考路》，01 版"}, {"id": "c662ed7d33", "date": "2026-10-28", "type": "短语", "big": "治理·法治·安全", "topics": ["法治"], "text": "从&quot;不吃苹果&quot;到&quot;锁住公章&quot;，规范权力是为了更好地为群众服务。（同上，辽宁锦州政务服务大厅&quot;双锁公章&quot;）", "src": ""}, {"id": "d0efa7be31", "date": "2026-10-28", "type": "短语", "big": "治理·法治·安全", "topics": ["治理精度"], "text": "金额未必有多大，啃食的却是群众最直接的获得感。", "src": "《把严的基调长期坚持下去》，19 版"}, {"id": "4f32370277", "date": "2026-10-28", "type": "短语", "big": "创新·人才·教育", "topics": ["技能人才"], "text": "人机协同能力，是劳动者最硬气的本领，也是智能时代防御风险最靠谱的&quot;安全带&quot;。", "src": "壹时评《让&quot;人机协同&quot;跑赢&quot;机器换人&quot;》，人民网 2026年10月27日"}, {"id": "5ffdc662dc", "date": "2026-10-28", "type": "短语", "big": "创新·人才·教育", "topics": ["辩证思维"], "text": "技术红利与技术风险，本就是同一枚硬币的两面。", "src": "同上"}, {"id": "609228c76d", "date": "2026-10-28", "type": "短语", "big": "方法论·万能句", "topics": ["辩证思维"], "text": "把人置于机器之前，把稳和好置于快和利之前。", "src": "同上"}, {"id": "e37cd43e51", "date": "2026-10-28", "type": "短语", "big": "方法论·万能句", "topics": ["系统思维"], "text": "水至柔，而润物无声，滴穿顽石；思想无形，却春风化雨，撼动山岳。", "src": "《一江碧水悟思想》，05 版"}, {"id": "659095108f", "date": "2026-10-28", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信"], "text": "如果没有中华五千年文明，哪里有什么中国特色？", "src": "习近平，转引自《思想如炬，照亮新的赶考路》，01 版"}, {"id": "f2816b7359", "date": "2026-10-28", "type": "短语", "big": "文化·精神·文明", "topics": ["精神文明"], "text": "以城塑人、以文化人。（《汲取我国古代城市建设治理智慧推动城市工作（有的放矢）》，2026年10月27日 09 版）", "src": ""}, {"id": "a0cff3c172", "date": "2026-10-28", "type": "短语", "big": "高质量发展·产业", "topics": ["高质量发展"], "text": "我国城镇化正从快速增长期转向稳定发展期，城市发展正从大规模增量扩张阶段转向存量提质增效为主的阶段。", "src": "习近平，转引自同上"}, {"id": "8fc2c45406", "date": "2026-10-28", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上"], "text": "只要我们深深植根人民、始终保持同人民群众的血肉联系，党的事业就无往而不胜。", "src": "《红梢林与红苹果》，《人民日报》2026年10月27日 01 版"}, {"id": "4a963a755d", "date": "2026-10-27", "type": "金句", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "在新征程上持之以恒推进全面从严治党，就是要确保党始终成为走在时代前列、人民衷心拥护、经得起各种风浪考验、朝气蓬勃的马克思主义执政党。", "src": "任仲平《在新征程上持之以恒推进全面从严治党》，《人民日报》2026年10月26日 01 版"}, {"id": "b98575a891", "date": "2026-10-27", "type": "金句", "big": "政绩观·党性修养", "topics": ["担当"], "text": "只要我们坚持道不变、志不改，一以贯之、勠力同心，就一定能够战胜前进中的各种艰难险阻，不断迈向成功的彼岸！", "src": "习近平（转引自任仲平，《人民日报》2026年10月26日 01 版）"}, {"id": "7cdd3d9e2d", "date": "2026-10-27", "type": "金句", "big": "为民·民生·基层", "topics": ["人民至上"], "text": "为什么老百姓衷心拥护中国共产党？因为我们党始终全心全意为人民服务、为各民族谋幸福。", "src": "习近平（转引自《人民日报》2026年10月26日 01 版述评）"}, {"id": "3501ab21e9", "date": "2026-10-27", "type": "金句", "big": "创新·人才·教育", "topics": ["科技创新"], "text": "我国很多重大科技成果都是依靠这个法宝搞出来的，千万不能丢了！", "src": "习近平论集中力量办大事（转引自任仲平，2026年10月26日 01 版）"}, {"id": "fdfd99d629", "date": "2026-10-27", "type": "金句", "big": "政绩观·党性修养", "topics": ["初心使命"], "text": "要砥砺初心使命，持之以恒、久久为功，继续回答好延安&#x27;窑洞之问&#x27;。", "src": "习近平 2026年新年贺词（转引自《人民日报》2026年10月26日 01 版述评）"}, {"id": "427961cc43", "date": "2026-10-27", "type": "金句", "big": "高质量发展·产业", "topics": ["高质量发展"], "text": "到本世纪中叶，我们要全面建成社会主义现代化强国、实现第二个百年奋斗目标。时间不等人！历史不等人！", "src": "习近平 2026年&quot;七一&quot;重要讲话（转引自任仲平，2026年10月26日 01 版）"}, {"id": "b5b1c895f7", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "治国必先治党，治党务必从严。（任仲平《在新征程上持之以恒推进全面从严治党》，《人民日报》2026年10月26日 01 版）", "src": ""}, {"id": "9425084b93", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "办好中国的事情，关键在党，关键在党要管党、全面从严治党。", "src": "张洋、孟祥夫《不断开创新时代管党治党、兴党强党新局面》，同上 01 版"}, {"id": "1c501adecc", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "全面从严治党永远在路上。这不是&quot;一阵风&quot;，不能&quot;歇歇脚&quot;，而是久久为功的行动。", "src": "同上"}, {"id": "4c5f969c9a", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "我们党之所以伟大，不在于不犯错误，而在于从不讳疾忌医。", "src": "习近平，转引自上稿"}, {"id": "8c16af1172", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["廉洁作风"], "text": "无私者无畏，我们党没有任何自己特殊的利益，这是我们党敢于刀刃向内的勇气之源、底气所在。", "src": "同上"}, {"id": "e045338621", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["担当"], "text": "使命越光荣，任务越艰巨，越需要自身过硬。", "src": "同上"}, {"id": "02b59d027f", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "敢管敢严、真管真严、长管长严。", "src": "同上"}, {"id": "f055b53de0", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "善于以时代发展要求审视自己、以强烈忧患意识警醒自己、以自我革命精神完善自己。", "src": "同上"}, {"id": "06f4f93c76", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "全面从严治党不止于正风肃纪、激浊扬清，更重塑了党的精气神、锻造了坚强的领导力。（《锻造&quot;实现愿景的非凡能力&quot;（评论员观察）》，2026年10月26日 05 版）", "src": ""}, {"id": "f146889dc0", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观"], "text": "让&quot;立党为公、为民造福、科学决策、真抓实干&quot;成为履职尽责的总要求。（01 版述评，转述树立和践行正确政绩观学习教育）", "src": ""}, {"id": "c3a82296b1", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["担当"], "text": "全面从严治党，绝非束缚干事手脚，而是通过明方向、立规矩、正风气、强免疫，营造积极健康、干事创业的政治生态。", "src": "同上"}, {"id": "c75bae2737", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["担当"], "text": "想干事者有舞台，能干事者有底气，干成事者有荣光。", "src": "同上"}, {"id": "52a7c5591c", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "事在四方，要在中央。（任仲平，2026年10月26日 01 版）", "src": ""}, {"id": "be16299df3", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "理论强，才能方向明、人心齐、底气足。", "src": "同上"}, {"id": "03d6734a24", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作"], "text": "对老百姓来说，他们身边每一件琐碎的小事，都是实实在在的大事。（习近平《之江新语》，转引自《把握好基层工作的&quot;大&quot;与&quot;小&quot;（思想纵横）》，2026年10月26日 09 版）", "src": ""}, {"id": "17e1a4d6a9", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["基层治理"], "text": "基层是国家治理体系的&quot;神经末梢&quot;，一头承载着党和国家的战略大局，一头连着千家万户的民生小事。", "src": "同上"}, {"id": "71b1b4d9b0", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作"], "text": "你与群众有多近，群众对你就有多亲。", "src": "01 版述评"}, {"id": "eb86b3e330", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上"], "text": "一餐一饭，关乎民生冷暖，关系人心向背。", "src": "任仲平"}, {"id": "c80276ce3c", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上"], "text": "人民群众反对什么、痛恨什么，我们就要坚决防范和纠正什么。", "src": "习近平，转引自任仲平"}, {"id": "b53d38bc34", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["民生保障"], "text": "我国受访民众对自身获得感、幸福感、安全感的认同比例均超92%。", "src": "任仲平引调查结果"}, {"id": "9803ba8b79", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["基层治理"], "text": "从新时代&quot;枫桥经验&quot;推动矛盾化解在基层、消弭于萌芽，到&quot;六尺巷工作法&quot;以&quot;让他三尺&quot;的和合智慧浸润邻里。", "src": "任仲平"}, {"id": "787a0e0d05", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作"], "text": "民心是最大的政治。一个政党，一个政权，其前途和命运最终取决于人心向背。", "src": "01 版述评"}, {"id": "289515463d", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["技能人才"], "text": "打破固有学制壁垒，让技能人才成长有通道、上升有空间。（《贯通培养，成才之路更多元（新知）》，2026年10月26日 05 版）", "src": ""}, {"id": "097386928b", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["教育"], "text": "教育是为了让不同的孩子在适合自己的赛道上成长成才。", "src": "同上"}, {"id": "9f27841328", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["教育"], "text": "办好不同类型的教育，畅通多元成才路径，让每条路都通向出彩的人生。", "src": "同上"}, {"id": "4c38527b74", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新"], "text": "关键不是&quot;买专利&quot;，而是投资一条从科研发现走向临床和市场的完整链条，打通从基础研究到产业落地的转化堵点。（《让医药知识产权成长为现实生产力（专家点评）》，2026年10月26日 02 版）", "src": ""}, {"id": "7ddaed667c", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新"], "text": "知识产权投资应更注重投早、投小、投长期、投硬科技。", "src": "同上"}, {"id": "71e7a0dd27", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["自立自强"], "text": "我国社会主义制度能够集中力量办大事是我们成就事业的重要法宝。", "src": "习近平，转引自任仲平"}, {"id": "e5bdcdc682", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["营商环境"], "text": "账款拖欠，看似是资金往来出现&quot;时差&quot;，实则是契约精神的慢性流失。（《促每笔账款按约兑现（人民时评）》，2026年10月26日 05 版）", "src": ""}, {"id": "56305bdf13", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["营商环境"], "text": "守约得到鼓励，违约受到惩戒，交易各方才更有动力自觉履约。", "src": "同上"}, {"id": "53fcb25030", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["营商环境"], "text": "事后清欠是&quot;止血&quot;，源头守约才是&quot;固本&quot;。", "src": "同上"}, {"id": "c4d395558e", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["营商环境"], "text": ], "text": "对紧急情况下的实干者、担当者，应给予更多理解支持，这是为了树立为担当者担当、为实干者撑腰的导向。（《善待实干者 包容担当者（人民锐评）》，同上05版）", "src": ""}, {"id": "520c854c4b", "date": "2026-10-22", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作", "公共服务"], "text": "百姓在哪硌得慌，咱就从哪下铲子。（《一个工匠对时代的致意（中国道路中国梦）》，同上05版）", "src": ""}, {"id": "64cd6b3e9f", "date": "2026-10-22", "type": "短语", "big": "为民·民生·基层", "topics": ["乡村振兴", "群众工作"], "text": "让农民成为环境治理的参与者、建设者和受益者。（《以精准治理提升农村人居环境质量（有的放矢）》，同上09版）", "src": ""}, {"id": "f008de0ae6", "date": "2026-10-22", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上", "初心使命"], "text": "坚持人民至上是三种精神共有的根本立场。", "src": "《照金精神、长征精神和延安精神的内在逻辑与时代赓续》，同上09版"}, {"id": "855b5b8b55", "date": "2026-10-22", "type": "短语", "big": "创新·人才·教育", "topics": ["技能人才", "青年成长"], "text": "干一行就要爱一行，爱一行就要钻一行。（《一个工匠对时代的致意（中国道路中国梦）》）", "src": ""}, {"id": "8c6dcf4da7", "date": "2026-10-22", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新", "自立自强"], "text": "让技术创新与标准建设同向发力，让标准建设既回应当下需求又着眼未来变化。（《以标准建设护航前沿科创（人民时评）》，同上05版）", "src": ""}, {"id": "114243bc29", "date": "2026-10-22", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新", "监管"], "text": "标准出台过晚，可能留下安全隐患；标准定型过早，又可能束缚创新探索。", "src": "同上"}, {"id": "53b71713b1", "date": "2026-10-22", "type": "短语", "big": "创新·人才·教育", "topics": ["教育", "青年成长"], "text": "继承光荣革命传统，赓续千年书院学脉，弘扬&quot;实事求是、敢为人先&quot;的精神，努力培养更多经世致用的优秀人才。", "src": "习近平致湖南大学建校100周年的贺信，2026年10月16日"}, {"id": "b0602b8751", "date": "2026-10-22", "type": "短语", "big": "高质量发展·产业", "topics": ["新质生产力", "系统思维"], "text": "中国经济呈现基础稳、优势多、韧性强、潜能大的鲜明特征，长期向好的支撑条件和基本趋势没有改变。", "src": "《深刻认识中国经济运行的三个突出特点》，同上01版"}, {"id": "11d63a3ec6", "date": "2026-10-22", "type": "短语", "big": "高质量发展·产业", "topics": ["高质量发展", "系统思维"], "text": "以高质量发展的确定性应对各种不确定性。", "src": "同上"}, {"id": "b0c9259ffe", "date": "2026-10-22", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育", "辩证思维"], "text": "重建禀赋认知，重构自身优势，才能打开转型新空间。（《被&quot;逼到墙角&quot;，就向新起跑（现场评论）》，同上05版）", "src": ""}, {"id": "e856ebc8d6", "date": "2026-10-22", "type": "短语", "big": "高质量发展·产业", "topics": ["高质量发展", "实干落实"], "text": "推动在建项目加快进度、新建项目开工建设，尽快形成更多实物工作量。", "src": "十四届甘肃省委常委会会议，2026年10月21日"}, {"id": "3aad25c32c", "date": "2026-10-22", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展", "生态修复"], "text": "昔日避之唯恐不及的荒漠，成了集发电、治沙、富民于一体的宝库。（《被&quot;逼到墙角&quot;，就向新起跑（现场评论）》）", "src": ""}, {"id": "15c635b597", "date": "2026-10-22", "type": "短语", "big": "生态文明·绿色发展", "topics": ["生态文明", "系统思维"], "text": "坚持山水林田湖草沙一体化保护和系统治理，不断巩固祁连山生态环境保护成果，坚决打好&quot;三北&quot;工程攻坚战。", "src": "十四届甘肃省委常委会会议，2026年10月21日"}, {"id": "fe60e43113", "date": "2026-10-22", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展", "能源转型"], "text": "牢固树立绿水青山就是金山银山理念，全面加快经济社会绿色低碳转型发展，坚定不移走生态优先、绿色发展之路。", "src": "同上"}, {"id": "5de4a75e35", "date": "2026-10-22", "type": "短语", "big": "治理·法治·安全", "topics": ["治理精度", "精准施策"], "text": "实现从粗放治理向精准治理的转变。（《以精准治理提升农村人居环境质量（有的放矢）》，同上09版）", "src": ""}, {"id": "2fc27477d2", "date": "2026-10-22", "type": "短语", "big": "治理·法治·安全", "topics": ["监管", "精准施策"], "text": "把握&quot;管太早&quot;与&quot;管太晚&quot;的平衡，关键是根据风险性质和技术成熟度，明确哪些要求必须先行。（《以标准建设护航前沿科创（人民时评）》）", "src": ""}, {"id": "87d7444edf", "date": "2026-10-22", "type": "短语", "big": "治理·法治·安全", "topics": ["应急管理", "治理精度"], "text": "不断提升预判的科学性、治理的有效性、处置的法治化。（《善待实干者 包容担当者（人民锐评）》）", "src": ""}, {"id": "ad4435aca2", "date": "2026-10-22", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信", "价值观"], "text": "精神的力量，穿越时空、激荡人心。（《中国精神何以立（评论员观察）》，同上05版）", "src": ""}, {"id": "3b1ab2cbdf", "date": "2026-10-22", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信", "价值观"], "text": "中国精神何以立？答案既在历史深处，也在亿万人民的烟火日常中。", "src": "同上"}, {"id": "840be87c59", "date": "2026-10-22", "type": "短语", "big": "文化·精神·文明", "topics": ["传统文化", "价值观"], "text": "传承精神不必重复前路，但须读懂前人的选择。", "src": "同上"}, {"id": "c5d76e4d41", "date": "2026-10-22", "type": "短语", "big": "开放·合作·全球治理", "topics": ["全球治理", "对外开放"], "text": "让更多中国方案上升为国际标准，就能更好把技术积累转化为规则影响力。（《以标准建设护航前沿科创（人民时评）》）", "src": ""}, {"id": "7b25599b95", "date": "2026-10-22", "type": "短语", "big": "开放·合作·全球治理", "topics": ["国际合作", "人类命运共同体"], "text": "在禀赋差异中加强经贸合作，在诉求差异中寻求共同利益，在文化差异中促进和合共生。（李强在上海合作组织成员国政府首脑（总理）理事会第二十五次会议上的讲话，2026年10月20日）", "src": ""}, {"id": "aac4233550", "date": "2026-10-22", "type": "短语", "big": "开放·合作·全球治理", "topics": ["对外开放", "全球治理"], "text": "在扩大开放中统筹用好两个市场、两种资源，着力强化甘肃在国家向西开放布局中的战略通道地位。", "src": "十四届甘肃省委常委会会议，2026年10月21日"}, {"id": "946c9428c7", "date": "2026-10-22", "type": "短语", "big": "方法论·万能句", "topics": ["辩证思维", "担当"], "text": "没有退路，反而逼出新路。（《被&quot;逼到墙角&quot;，就向新起跑（现场评论）》）", "src": ""}, {"id": "b35e52d448", "date": "2026-10-22", "type": "短语", "big": "方法论·万能句", "topics": ["辩证思维", "精准施策"], "text": "资源有限不可怕，怕的是自我设限。", "src": "同上"}, {"id": "45013a96ed", "date": "2026-10-22", "type": "短语", "big": "方法论·万能句", "topics": ["久久为功", "系统思维"], "text": "韧性并不是被动承受压力，而是在正视现实困难的基础上保持长期视野，通过学习、创新和调整，创造新的可能。（《长征具有跨越时代与国界的启示意义（国际论坛）》，《人民日报》2026年10月21日）", "src": ""}, {"id": "3302d8a10c", "date": "2026-10-22", "type": "短语", "big": "方法论·万能句", "topics": ["工作方法", "实干落实"], "text": "千方百计抢时间、赶进度、补缺口、挖潜力。", "src": "四川省委财经委员会第十四次会议，2026年10月21日"}, {"id": "171cb85454", "date": "2026-10-21", "type": "金句", "big": "文化·精神·文明", "topics": ["文化自信", "精神文明"], "text": "伟大长征精神，是中国共产党人及其领导的人民军队革命风范的生动反映，是中华民族自强不息的民族品格的集中展示，是以爱国主义为核心的民族精神的最高体现。", "src": "习近平，转引自《从万里长征走向伟大复兴》（《人民日报》2026年10月20日09版）"}, {"id": "80f0b4c9e5", "date": "2026-10-21", "type": "金句", "big": "创新·人才·教育", "topics": ["青年成长", "担当"], "text": "一代人有一代人的长征，一代人有一代人的担当。建成社会主义现代化强国，实现中华民族伟大复兴，是一场接力跑。", "src": "习近平，转引自同上"}, {"id": "7583f4c370", "date": "2026-10-21", "type": "金句", "big": "方法论·万能句", "topics": ["久久为功", "系统思维"], "text": "积小胜为大胜、积跬步至千里。", "src": "《从万里长征走向伟大复兴》（《人民日报》2026年10月20日09版）"}, {"id": "fada8b29ee", "date": "2026-10-21", "type": "金句", "big": "为民·民生·基层", "topics": ["民生保障", "兜底"], "text": "要大力发展普惠托育服务体系。", "src": "习近平，转引自《把握发展普惠托育和托幼一体化服务的着力点》（《人民日报》2026年10月20日09版）"}, {"id": "c8fec4f96b", "date": "2026-10-21", "type": "金句", "big": "开放·合作·全球治理", "topics": ["人类命运共同体", "对外开放"], "text": "中国原创技术在提升自身能力的同时，也为其他国家提供更多选择，是参与构建人类卫生健康共同体的切实行动。", "src": "《&quot;重病轻治&quot;的创新之道（微观）》（《人民日报》2026年10月20日05版）"}, {"id": "a3d3d2ed2e", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观", "担当"], "text": "平凡岗位可建不凡之功，无名坚守可成不朽之名。（《无名与有名（评论员观察）》，《人民日报》2026年10月20日05版）", "src": ""}, {"id": "085a76df8e", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观", "初心使命"], "text": "新时代的无名，是坚守初心的无我境界；新时代的有名，是创造业绩的功成有我。", "src": "同上"}, {"id": "93b25ba120", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["担当", "青年干部"], "text": "高质量发展呼唤&quot;十年磨一剑&quot;的执着，科技自立自强需要&quot;甘坐冷板凳&quot;的定力，乡村全面振兴亟待&quot;俯首甘为孺子牛&quot;的深耕。", "src": "同上"}, {"id": "b29e63c315", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观", "党性修养"], "text": "钝感，是对个人得失的淡然，是甘做铺垫工作、甘积尺寸之功、甘抓未成之事。（《&quot;在平时多做过细的群众工作&quot;（大家谈）》，同上05版）", "src": ""}, {"id": "2c251a8c19", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养", "廉洁作风"], "text": "不明确责任，不落实责任，不追究责任，从严治党是做不到的。（习近平，转引自《把管党治党政治责任落实好（金台潮声）》，同上19版）", "src": ""}, {"id": "31457ef1e5", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养", "团结合作"], "text": "牢牢把握正确办学方向，持续加强政治培训，广泛凝聚政治共识。", "src": "习近平2026年10月20日致中央社会主义学院建院70周年贺信"}, {"id": "5be0ed6b69", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上", "初心使命"], "text": "许许多多无怨无悔、倾情奉献的无名英雄，他们以普通人的平凡书写了不平凡的人生。（习近平，转引自《无名与有名（评论员观察）》）", "src": ""}, {"id": "4d7e810bd6", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作", "基层治理"], "text": "敏感，是对群众冷暖、风险隐患的敏锐，是见事早、行动快。（《&quot;在平时多做过细的群众工作&quot;（大家谈）》）", "src": ""}, {"id": "a7809fca54", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作", "调查研究"], "text": "多向群众&quot;取经&quot;，才能把工作干到群众心坎上。", "src": "同上"}, {"id": "dc020dff37", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作", "基层治理"], "text": "先与群众共情，感情拉近了，工作才好做。（《统筹基层工作的&quot;跳进去&quot;与&quot;领出来&quot;（思想纵横）》，同上09版）", "src": ""}, {"id": "2189bfa6a9", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作", "担当"], "text": "把群众&quot;盼的事&quot;变成手中&quot;干的事&quot;，把&quot;闹心事&quot;办成&quot;舒心事&quot;。", "src": "同上"}, {"id": "a67c94e619", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上", "群众工作"], "text": "我们共产党的各级干部到哪都要问一声乡亲们：还想过什么样的好生活？更好的生活，我们一起来推动、来实现。", "src": "习近平，转引自《弘扬伟大长征精神 走好今天的长征路》，同上01版"}, {"id": "4b98608871", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["民生保障", "公共服务"], "text": "普惠托育需坚持公共利益优先，保基本、兜底线、促公平。（《把握发展普惠托育和托幼一体化服务的着力点（有的放矢）》，同上09版）", "src": ""}, {"id": "e53f99b246", "date": "2026-10-21", "type": "短语", "big": "创新·人才·教育", "topics": ["人才评价", "科研生态"], "text": "合肥这个地方是&quot;养人&quot;的，培养出了这么多优秀人才，是创新的天地。（习近平2016年4月26日在中国科学技术大学考察时的讲话，转引自《这个地方何以&quot;养人&quot;》，同上19版）", "src": ""}, {"id": "a99d57c6d2", "date": "2026-10-21", "type": "短语", "big": "创新·人才·教育", "topics": ["人才评价", "营商环境"], "text": "打破户籍、地域、人事关系等限制，让拥有多年科研和工程实践经验的科研人员继续在产业一线发挥专业能力。", "src": "同上"}, {"id": "4ff4f1f154", "date": "2026-10-21", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新", "自立自强"], "text": "要把满足人民对美好生活的向往作为科技创新的落脚点。（习近平，转引自《&quot;重病轻治&quot;的创新之道（微观）》，同上05版）", "src": ""}, {"id": "9ddfd87104", "date": "2026-10-21", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新", "科研生态"], "text": "现实难题常常跨越学科边界，解题也需打通知识之间的壁垒。", "src": "同上"}, {"id": "04f9dbdb9a", "date": "2026-10-21", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新", "公共服务"], "text": "高精尖与广覆盖并不矛盾，让更多人方便使用，本身就是值得投入的创新课题。", "src": "同上"}, {"id": "cc4635ce78", "date": "2026-10-21", "type": "短语", "big": "高质量发展·产业", "topics": ["数字经济", "新质生产力"], "text": "智能经济不是简单给经济运行&quot;装AI插件&quot;，而是通过数据流动、自动响应和实时优化，对生产、流通、消费进行智能化重构。（《让智能经济更好激发新动能（人民时评）》，同上05版）", "src": ""}, {"id": "5fd9f400b9", "date": "2026-10-21", "type": "短语", "big": "高质量发展·产业", "topics": ["新质生产力", "精准施策"], "text": "智能经济的含金量，最终要体现在车间的报表上、工厂的产能里、亿万用户真实的获得感中。", "src": "同上"}, {"id": "a611c69b23", "date": "2026-10-21", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育", "新质生产力"], "text": "传统产业经过改造提升同样能跻身先进制造业行列。（敖鸿《坚持智能化绿色化融合化方向，全力推动贵州先进制造业高质量发展》，2026年10月19日）", "src": ""}, {"id": "02428801fc", "date": "2026-10-21", "type": "短语", "big": "高质量发展·产业", "topics": ["高质量发展", "产业培育"], "text": "以提质增效为目标、以增强核心功能为重点、以破除体制机制障碍为突破口。", "src": "王晓晖2026年10月20日在全省进一步深化国资国企改革工作推进会议上的讲话"}, {"id": "4233e0b6ef", "date": "2026-10-21", "type": "短语", "big": "生态文明·绿色发展", "topics": ["能源转型", "绿色发展"], "text": "要积极推进燃煤机组改造升级，持续降低能耗、排放、污染，助力绿色低碳转型。", "src": "林武2026年10月20日在聊城市调研时的讲话"}, {"id": "5fe9ab2dcd", "date": "2026-10-21", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展", "系统思维"], "text": "坚持激励与约束并重，统筹产业结构调整、污染治理、生态保护、应对气候变化，协同推进降碳、减污、扩绿、增长。（《美丽四川建设&quot;十五五&quot;规划》，川府发〔2026〕20号，2026年10月9日印发）", "src": ""}, {"id": "8c81e9b106", "date": "2026-10-21", "type": "短语", "big": "治理·法治·安全", "topics": ["法治", "监管"], "text": "有权必有责、有责要担当、失责必追究。（《把管党治党政治责任落实好（金台潮声）》）", "src": ""}, {"id": "ba5c7dae6e", "date": "2026-10-21", "type": "短语", "big": "治理·法治·安全", "topics": ["监管", "系统思维"], "text": "只有责任环环相扣、压力层层传导，才能确保每个责任主体各司其职、各负其责。", "src": "同上"}, {"id": "78287a2764", "date": "2026-10-21", "type": "短语", "big": "治理·法治·安全", "topics": ["风险防控", "治理精度"], "text": "把功夫下在看不见处，把责任落在每一个细节，方能把工作做好、让群众满意。（《&quot;在平时多做过细的群众工作&quot;（大家谈）》）", "src": ""}, {"id": "bfafe43240", "date": "2026-10-21", "type": "短语", "big": "治理·法治·安全", "topics": ["监管", "风险防控"], "text": "在坚守质量和安全底线前提下为创新留足发展空间，严禁放任不管或简单封杀。", "src": "国家发展改革委2026年10月20日新闻发布会"}, {"id": "dfe8807b1a", "date": "2026-10-21", "type": "短语", "big": "文化·精神·文明", "topics": ["精神文明", "久久为功"], "text": "民族复兴绝非朝夕之功、一蹴而就，必须保持历史耐心、战略定力，一步一个脚印走、一茬接着一茬干。", "src": "《从万里长征走向伟大复兴》，《人民日报》2026年10月20日09版"}, {"id": "b65a9322ff", "date": "2026-10-21", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信", "价值观"], "text": "实现伟大的理想，没有平坦的大道可走。", "src": "同上"}, {"id": "2a08085b16", "date": "2026-10-21", "type": "短语", "big": "文化·精神·文明", "topics": ["传统文化", "初心使命"], "text": "共产党人和老百姓的感情就是共用一条被子的感情。", "src": "习近平，转引自同上"}, {"id": "d802d37c44", "date": "2026-10-21", "type": "短语", "big": "开放·合作·全球治理", "topics": ["对外开放", "团结合作"], "text": "先进技术的推广应用，没有国界。（《&quot;重病轻治&quot;的创新之道（微观）》）", "src": ""}, {"id": "8ec8b4425e", "date": "2026-10-21", "type": "短语", "big": "开放·合作·全球治理", "topics": ["全球治理", "团结合作"], "text": "开放数据、交流标准、培养人才，使合作从提供一项成果延伸到帮助形成应用能力。", "src": "同上"}, {"id": "f5dde91c6c", "date": "2026-10-21", "type": "短语", "big": "开放·合作·全球治理", "topics": ["对外开放", "全球治理"], "text": "从&quot;中国项目&quot;到&quot;全球经验&quot;。（《人民日报》2026年10月20日02版，新开发银行发布首份《中国国别项目组合评价报告》）", "src": ""}, {"id": "8855782532", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["辩证思维", "工作方法"], "text": "别把熟悉当正确，别把改进当突破——回到起始点，攻克薄弱点，就能打开全新空间。（《&quot;重病轻治&quot;的创新之道（微观）》）", "src": ""}, {"id": "64eb50eff1", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["久久为功", "系统思维"], "text": "基础设施先行、应用场景跟进、组织方式适应、整体效率提升，是技术从诞生到成熟的普遍路径。（《让智能经济更好激发新动能（人民时评）》）", "src": ""}, {"id": "3c6e07fd35", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["工作方法", "政绩观"], "text": "敏感于事，钝感于己，基层干部当有这样的胸怀和担当。（《&quot;在平时多做过细的群众工作&quot;（大家谈）》）", "src": ""}, {"id": "00266f0526", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["精准施策", "政绩观"], "text": "确保新质生产力发展不走偏、不冒进、不泡沫化。", "src": "《中共中央 国务院关于发展新质生产力的意见》，2026年10月印发"}, {"id": "92da0e2652", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["精准施策", "工作方法"], "text": "有的放矢把确定性工作做到位，以最大努力争取最好结果。", "src": "十四届甘肃省政府第139次常务会议，2026年10月20日"}, {"id": "2f817fb095", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["精准施策", "系统思维"], "text": "发展新质生产力，因地制宜既是立足各地资源禀赋、防止同质化竞争的硬性工作要求，也是尊重区域发展差异、把各地比较优势转化为发展实效的科学方法论。（国家发展改革委创新和高技术发展司副司长任中保，2026年10月20日新闻发布会）", "src": ""}, {"id": "c0a10a4d17", "date": "2026-10-20", "type": "金句", "big": "创新·人才·教育", "topics": ["自立自强", "科技创新"], "text": "推动科技创新和产业创新深度融合。这是以高水平科技自立自强引领发展新质生产力的关键。要突出科技创新供给和产业需求牵引，推动产学研融通创新，打通科技加速向现实生产力转化的通道。", "src": "习近平2026年7月8日在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话（学习强国每日金句，2026年10月19日）"}, {"id": "dac1e52875", "date": "2026-10-20", "type": "金句", "big": "治理·法治·安全", "topics": ["廉洁作风", "监管"], "text": "反腐败是一场输不起也决不能输的重大斗争，一刻不能停、半步不能退。", "src": "习近平《以更高标准、更实举措推进全面从严治党》，《求是》2026年第20期"}, {"id": "2afedd6284", "date": "2026-10-20", "type": "金句", "big": "政绩观·党性修养", "topics": ["政绩观", "系统思维"], "text": "要按照党中央战略决策和规划部署，树立和践行正确政绩观，完整准确全面贯彻新发展理念，紧跟时代潮流、抢抓发展机遇，立足自身条件、发挥比较优势，因地制宜推动高质量发展。", "src": "习近平2026年10月16日在内蒙古乌兰察布考察时的讲话（新华社《登高望远处，风光正无限》，《光明日报》2026年10月19日01版）"}, {"id": "0d504e0881", "date": "2026-10-20", "type": "金句", "big": "文化·精神·文明", "topics": ["精神文明", "初心使命"], "text": "一切向前走，都不能忘记走过的路，都不能忘记为什么出发。", "src": "钟华论《在新的长征路上继续奋勇前进》，新华社2026年10月19日"}, {"id": "05ecfa515c", "date": "2026-10-20", "type": "金句", "big": "方法论·万能句", "topics": ["系统思维", "担当"], "text": "推进中国式现代化，是一项前无古人的开创性事业，必然会遇到各种可以预料和难以预料的风险挑战、艰难险阻甚至惊涛骇浪。", "src": "钟华论《在新的长征路上继续奋勇前进》，新华社2026年10月19日"}, {"id": "efc138a7a4", "date": "2026-10-20", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养", "初心使命"], "text": "以党的初心为本心、以党的使命为生命，把全部智慧和力量凝聚到实现党的中心任务上来。", "src": "习近平《以更高标准、更实举措推进全面从严治党》，《求是》2026年第20期"}, {"id": "753ce59258", "date": "2026-10-20", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观", "党性修养"], "text": "以功成不必在我、功成必定有我的精神境界，心无旁骛推进中国式现代化。", "src": "同上"}, {"id": "28db8bddc6", "date": "2026-10-20", "type": "短语", "big": "政绩观·党性修养", "topics": ["廉洁作风", "党性修养"], "text": "落实中央八项规定精神没有捷径，关键就在常、长二字，不经常抓容易出现反复，不长期抓难以形成自觉。", "src": "同上"}, {"id": "9250f3a9bd", "date": "2026-10-20", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上", "群众工作"], "text": "人民群众有着无尽的智慧和力量，只有始终相信人民，紧紧依靠人民，充分调动广大人民的积极性、主动性、创造性，才能凝聚起众志成城的磅礴之力。（习近平，转引自《&quot;广大人民群众是长征胜利的力量源泉&quot;》，《人民日报》2026年10月19日01版）", "src": ""}, {"id": "9da037b84b", "date": "2026-10-20", "type": "短语", "big": "为民·民生·基层", "topics": ["公共服务", "民生保障"], "text": "保持清醒判断，才能看穿营销陷阱；具备科学素养，才能避开认知误区。（《当好自己健康的&quot;主理人&quot;（人民时评）》，《人民日报》2026年10月19日05版）", "src": ""}, {"id": "072eca98cd", "date": "2026-10-20", "type": "短语", "big": "为民·民生·基层", "topics": ["公共服务", "兜底"], "text": "既&quot;治已病&quot;，也&quot;防未病&quot;，在健康中国战略统筹下，以健康为中心的理念正助力越来越多人远离疾病、享受幸福。", "src": "同上"}, {"id": "1665f17f42", "date": "2026-10-20", "type": "短语", "big": "创新·人才·教育", "topics": ["青年成长", "担当"], "text": "不负韶华，不负时代，不负人民，在青春的赛道上奋力奔跑，争取跑出当代青年的最好成绩。", "src": "钟华论《在新的长征路上继续奋勇前进》，新华社2026年10月19日"}, {"id": "d776a1f529", "date": "2026-10-20", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新", "自立自强"], "text": "逐梦星辰大海、勇攀创新高峰，是广大青年科技工作者们不懈的追求。", "src": "同上"}, {"id": "b7a11b8298", "date": "2026-10-20", "type": "短语", "big": "高质量发展·产业", "topics": ["高质量发展", "精准施策"], "text": "县域经济发展得好不好、强不强，关键在于能不能做到因地制宜，有没有抓住&quot;特&quot;字做文章。", "src": "叶振宇《因地制宜推动县域经济高质量发展》，人民论坛网2026年10月19日"}, {"id": "3d7c3a7789", "date": "2026-10-20", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育", "新质生产力"], "text": "要把特色产业发展壮大为特色优势产业，关键在创新，包括商业模式创新、业态创新、装备或工艺技术创新。", "src": "同上"}, {"id": "06175956f5", "date": "2026-10-20", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育", "就业"], "text": "做强做大县域优势特色产业，使之成为吸引本地人就业的&quot;蓄水池&quot;。", "src": "同上"}, {"id": "a372bfc2df", "date": "2026-10-20", "type": "短语", "big": "高质量发展·产业", "topics": ["数字经济", "营商环境"], "text": "推动智能消费设施和服务向县域延伸，完善县域智能产品服务网络，激发下沉市场活力。", "src": "《商务部等9部门关于加快推进科技兴商的意见》，2026年10月19日发布"}, {"id": "1bfa116fd6", "date": "2026-10-20", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展", "辩证思维"], "text": "统筹生态保护与文旅发展，实现生态效益、社会效益有机统一。", "src": "自治区党委书记陈刚2026年10月19日在河池市凤山县督导调研时的讲话"}, {"id": "0d72e28cfd", "date": "2026-10-20", "type": "短语", "big": "生态文明·绿色发展", "topics": ["生态文明", "监管"], "text": "新账旧账一起算，拉网式排查整治，全力清零存量问题，坚决遏制增量问题。", "src": "同上"}, {"id": "941e19cd66", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["法治", "监管"], "text": "确保制度规定真正成为带电的高压线。", "src": "习近平《以更高标准、更实举措推进全面从严治党》，《求是》2026年第20期"}, {"id": "1fb0438c50", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["法治", "监管"], "text": "明规矩不彰，潜规则必然盛行；潜规则大行其道，明规矩就会沦为摆设。", "src": "同上"}, {"id": "590e81daed", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["监管", "法治"], "text": "遏制潜规则，关键在于提升明规矩的执行力，真正让权力在阳光下运行。", "src": "同上"}, {"id": "6e07edb253", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["监管", "系统思维"], "text": "统筹用好全面监督的&quot;无影灯&quot;和强力办案的&quot;手术刀&quot;，以全链条协作促进一体化治理。", "src": "同上"}, {"id": "bb62ed8aed", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["安全观", "系统思维"], "text": "完善全量全要素全生命周期风险监测预警响应体系，健全基层协同治理机制，推动风险隐患全量排查、闭环管控。（重庆市委理论学习中心组专题学习会，2026年10月19日）", "src": ""}, {"id": "f3df7e82c6", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["风险防控", "应急管理"], "text": "推动风险隐患全量全要素全生命周期闭环管控，构建&quot;人防+技防+智防&quot;融合防控体系。", "src": "重庆市委书记袁家军2026年10月19日在数字重庆建设推进会上的讲话"}, {"id": "8be7286012", "date": "2026-10-20", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信", "传统文化"], "text": "文化亘古亘新。中华优秀传统文化以鲜活姿态融入当代生活，显示出别样生机与活力，关键在于&quot;第二个结合&quot;。（《千年文脉何以新（评论员观察）》，《人民日报》2026年10月19日05版）", "src": ""}, {"id": "a3569c1f32", "date": "2026-10-20", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信", "传统文化"], "text": "&quot;结合&quot;不是&quot;拼盘&quot;，不是简单的&quot;物理反应&quot;，而是深刻的&quot;化学反应&quot;。", "src": "同上"}, {"id": "754529b2b4", "date": "2026-10-20", "type": "短语", "big": "文化·精神·文明", "topics": ["传统文化", "文化自信"], "text": "文化赋能高质量发展，在&quot;形&quot;更在&quot;魂&quot;。", "src": "同上"}, {"id": "b387d342de", "date": "2026-10-20", "type": "短语", "big": "文化·精神·文明", "topics": ["精神文明", "价值观"], "text": "长征最动人的，不是天生英雄的故事，而是普通人在绝境中的不普通选择。（《长征精神何以穿越时空、历久弥新（人民论坛）》，《人民日报》2026年10月19日04版）", "src": ""}, {"id": "1cbf6408a7", "date": "2026-10-20", "type": "短语", "big": "文化·精神·文明", "topics": ["精神文明", "初心使命"], "text": "日子连着日子，一步一步往前走。每个人的步伐叠加起来，就是民族复兴的浩荡前行。", "src": "同上"}, {"id": "0657a9ca87", "date": "2026-10-20", "type": "短语", "big": "开放·合作·全球治理", "topics": ["全球治理", "文化自信"], "text": "对历史最好的继承就是创造新的历史，对人类文明最大的礼敬就是创造人类文明新形态。（《千年文脉何以新（评论员观察）》，引习近平总书记重要论述）", "src": ""}, {"id": "58c2e921d0", "date": "2026-10-20", "type": "短语", "big": "方法论·万能句", "topics": ["精准施策", "系统思维"], "text": "任何工作都要实事求是、从实际出发，切忌生搬硬套、上下一般粗。", "src": "习近平《以更高标准、更实举措推进全面从严治党》，《求是》2026年第20期"}, {"id": "293d0b5da5", "date": "2026-10-20", "type": "短语", "big": "方法论·万能句", "topics": ["久久为功", "政绩观"], "text": "要防止临近换届等待观望不作为、换届后急功近利&quot;翻烧饼&quot;，确保一张蓝图绘到底。", "src": "同上"}, {"id": "22cd4b746c", "date": "2026-10-20", "type": "短语", "big": "方法论·万能句", "topics": ["辩证思维", "系统思维"], "text": "健康认知重在因人而异、具体分析，将多元生活和身材差异视为正常。", "src": "《当好自己健康的&quot;主理人&quot;》"}, {"id": "4f732c3f14", "date": "2026-10-19", "type": "金句", "big": "生态文明·绿色发展", "topics": ["生态文明", "系统思维"], "text": "以自然之道，养万物之生，这是人与自然和谐共生的辩证法。", "src": "《人民日报》2026年10月18日01版《&quot;有高远目标，更有耐心有定力&quot;——习近平总书记在内蒙古乌兰察布考察纪实》"}, {"id": "86e56e97f3", "date": "2026-10-19", "type": "金句", "big": "高质量发展·产业", "topics": ["高质量发展", "系统思维"], "text": "观一域，见全局。", "src": "《人民日报》2026年10月18日02版《从乌兰察布转型记，感悟&quot;统筹区域发展&quot;之道》"}, {"id": "47d2e84b4e", "date": "2026-10-19", "type": "金句", "big": "开放·合作·全球治理", "topics": ["全球治理", "人类命运共同体"], "text": "中国坚持将自身发展经验转化为可共享的国际公共产品。", "src": "《人民日报》2026年10月18日03版《减贫之路，众行方能致远（和音）》"}, {"id": "d0413674a3", "date": "2026-10-19", "type": "金句", "big": "方法论·万能句", "topics": ["调查研究", "系统思维"], "text": "得其大者方能兼其小。", "src": "《人民日报》2026年10月18日01版乌兰察布考察纪实（谈&quot;从整个大局看内蒙古的生态安全屏障建设&quot;）"}, {"id": "63a8531ce2", "date": "2026-10-19", "type": "金句", "big": "文化·精神·文明", "topics": ["文化自信", "初心使命"], "text": "管你什么险山恶水，我们一定可以克服。", "src": "黄镇《长征画集》题句，《人民日报》2026年10月18日08版《锅灰为墨写远征》引"}, {"id": "7e938b8c15", "date": "2026-10-19", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观", "发展观"], "text": "全国各地资源禀赋不同，只有因地制宜、扬长避短，方能找到高质量发展的持续发力点。这其中，检验的是发展观，也是政绩观。（习近平2026年10月16日在内蒙古乌兰察布市考察时的讲话，《人民日报》2026年10月18日01版）", "src": ""}, {"id": "7206034109", "date": "2026-10-19", "type": "短语", "big": "政绩观·党性修养", "topics": ["廉洁作风", "党性修养"], "text": "在众目睽睽之下，循规蹈矩不算本事；能在无人看见时依然坚守底线，才是真功夫。", "src": "人民论坛哲思《严格的自律：慎初、慎独、慎微》，2026年10月18日"}, {"id": "8c106d06e2", "date": "2026-10-19", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养", "青年成长"], "text": "知所从来，才能明所将往。人想往高处走，要先问根深不深。", "src": "人民论坛哲思《人往高处走，先把根扎稳》，2026年10月18日"}, {"id": "3118a8eb33", "date": "2026-10-19", "type": "短语", "big": var USED = {};
try { USED = JSON.parse(localStorage.getItem('rv_used') || '{}'); } catch (e) { USED = {}; }
function save() { try { localStorage.setItem('rv_used', JSON.stringify(USED)); } catch (e) {} }
var topic = '__all__', onlyUnused = false, kw = '', drawMode = false, drawIds = [];

function esc(s){return s;}
function el(id){return document.getElementById(id);}

function bigList() {
  var m = {};
  DATA.forEach(function (d) {
    if (!m[d.big]) m[d.big] = { t: 0, u: 0 };
    m[d.big].t++;
    if (!USED[d.id]) m[d.big].u++;
  });
  var a = [];
  BIG_ORDER.forEach(function (b) { if (m[b]) a.push([b, m[b].u, m[b].t]); });
  Object.keys(m).forEach(function (k) { if (BIG_ORDER.indexOf(k) < 0) a.push([k, m[k].u, m[k].t]); });
  return a;
}
function renderChips() {
  var un = DATA.filter(function (d) { return !USED[d.id]; }).length;
  var h = '<div class="chip' + (topic === '__all__' ? ' on' : '') + '" onclick="setTopic(\'__all__\')">全部<i>' + un + '/' + DATA.length + '</i></div>';
  bigList().forEach(function (p) {
    h += '<div class="chip' + (topic === p[0] ? ' on' : '') + '" onclick="setTopic(\'' + p[0].replace(/'/g, '') + '\')">' + p[0] + '<i>' + p[1] + '/' + p[2] + '</i></div>';
  });
  el('chips').innerHTML = h;
}
function setTopic(t) { topic = t; drawMode = false; render(); }
function setUnused(b) { onlyUnused = b; el('bu').className = 'btn' + (b ? ' on' : ''); drawMode = false; render(); }
function setKw(v) { kw = v.trim(); drawMode = false; render(); }
function toggle(id) {
  if (USED[id]) delete USED[id]; else USED[id] = 1;
  save(); render();
}
function match(d) {
  if (topic !== '__all__' && d.big !== topic) return false;
  if (onlyUnused && USED[d.id]) return false;
  if (kw && d.text.indexOf(kw) < 0 && d.topics.join('').indexOf(kw) < 0 && d.big.indexOf(kw) < 0) return false;
  return true;
}
function say(btn, txt) {
  if (!('speechSynthesis' in window)) { btn.textContent = '不支持'; return; }
  if (window.__spk === btn) { window.speechSynthesis.cancel(); btn.textContent = '🔊'; window.__spk = null; return; }
  window.speechSynthesis.cancel();
  if (window.__spk) window.__spk.textContent = '🔊';
  var u = new SpeechSynthesisUtterance(txt);
  u.lang = 'zh-CN'; u.rate = 0.92;
  u.onend = function () { btn.textContent = '🔊'; window.__spk = null; };
  btn.textContent = '■'; window.__spk = btn;
  window.speechSynthesis.speak(u);
}
function draw() {
  var pool = DATA.filter(function (d) { return match(d) && !USED[d.id]; });
  if (pool.length === 0) { alert('当前筛选下没有未用过的句子'); return; }
  pool.sort(function () { return Math.random() - 0.5; });
  drawIds = pool.slice(0, 5).map(function (d) { return d.id; });
  drawMode = true; render();
  window.scrollTo(0, 0);
}
function stat() {
  var u = 0, w = 0;
  var today = new Date();
  DATA.forEach(function (d) {
    if (USED[d.id]) u++;
    var dd = new Date(d.date);
    if ((today - dd) / 86400000 <= 7) w++;
  });
  el('s1').textContent = DATA.length;
  el('s2').textContent = u;
  el('s3').textContent = DATA.length - u;
  el('s4').textContent = w;
}
function render() {
  stat(); renderChips();
  var list = DATA.filter(function (d) { return drawMode ? drawIds.indexOf(d.id) >= 0 : match(d); });
  var h = '';
  list.forEach(function (d) {
    var tg = '<span class="tag big">' + d.big + '</span>'
      + d.topics.map(function (t) { return '<span class="tag sm">' + t + '</span>'; }).join('');
    h += '<div class="it' + (USED[d.id] ? ' used' : '') + (d.type === '短语' ? ' phrase' : '') + '">'
      + '<div class="tx">' + d.text + '</div><div class="mt">' + tg
      + '<span class="dt">' + d.date.slice(5) + ' · ' + d.type + '</span>'
      + (d.src ? '<span class="src">' + d.src + '</span>' : '')
      + '<button class="ibtn say" onclick="say(this, this.parentNode.parentNode.querySelector(\'.tx\').innerText)">🔊</button>'
      + '<button class="ibtn' + (USED[d.id] ? ' on' : '') + '" onclick="toggle(\'' + d.id + '\')">'
      + (USED[d.id] ? '已用过 ✓' : '标为已用') + '</button></div></div>';
  });
  if (!h) h = '<div class="empty">没有符合条件的句子</div>';
  el('list').innerHTML = h;
  el('cnt').textContent = list.length;
  el('draw').style.display = drawMode ? 'block' : 'none';
  el('dbtn').textContent = drawMode ? '退出抽签' : '随机抽 5 句';
}
function exportUsed() {
  var blob = new Blob([JSON.stringify({ used: USED, at: new Date().toISOString() }, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '摘抄已用清单.json';
  a.click();
}
function importUsed(inp) {
  var f = inp.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var o = JSON.parse(r.result);
      USED = o.used || o;
      save(); render(); alert('已恢复 ' + Object.keys(USED).length + ' 条标记');
    } catch (e) { alert('文件格式不对'); }
  };
  r.readAsText(f);
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('../sw.js').catch(function () {}); });
}
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>摘抄复盘 · 申论晨读</title>
<link rel="icon" href="../icon-192.png">
<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#1B2430;--sub:#7A869A;--line:#EAEEF4;
--brand:#1F3864;--brand2:#3A6EAF;--accent:#2E9E6B;--warn:#C0563B;--r:16px;
--sh:0 2px 10px rgba(24,40,70,.06);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 0}
.hero{background:linear-gradient(135deg,#24406E,#1F3864);color:#fff;border-radius:20px;
padding:16px 18px;box-shadow:0 6px 18px rgba(31,56,100,.22);margin-bottom:12px}
.hero .d1{font-size:13px;opacity:.85;letter-spacing:.5px}
.hero .d2{font-size:20px;font-weight:700;margin-top:2px}
.hero .d3{font-size:12.5px;opacity:.82;margin-top:5px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:10px 6px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--brand);line-height:1.2}
.stat span{font-size:11.5px;color:var(--sub)}
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:12px}
.panel .pt{font-size:13.5px;font-weight:700;color:var(--brand);margin-bottom:8px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;background:#EAF2FB;color:var(--brand2);border-radius:16px;padding:5px 12px;
font-size:12.5px;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);color:#fff}
.chip i{font-style:normal;opacity:.65;margin-left:3px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{background:#fff;border:1px solid var(--line);color:var(--brand);border-radius:18px;
padding:7px 13px;font-size:13px;font-weight:600;font-family:inherit;box-shadow:var(--sh);cursor:pointer}
.btn:active{background:#EEF2F8}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=search]{flex:1;min-width:150px;border:1px solid var(--line);border-radius:18px;
padding:7px 13px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff}
.it{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:13px 15px;margin-bottom:10px;
border-left:4px solid var(--brand2)}
.it.used{opacity:.5;border-left-color:#C9D2E0}
.it.phrase{border-left-color:#E5A23C}
.it .tx{font-size:15.3px;line-height:1.85;color:#243247}
.it.phrase .tx{font-size:14.5px;color:#5A4A1E}
.it .mt{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}
.tag{display:inline-block;background:#EAF2FB;color:var(--brand2);border-radius:6px;
padding:1px 7px;font-size:12px;font-weight:700}
.tag.big{background:var(--brand);color:#fff}
.tag.sm{background:#F2F5F9;color:#8A94A6;font-weight:500;font-size:11.5px}
.it .dt{font-size:11.5px;color:var(--sub)}
.it .src{font-size:11.5px;color:var(--sub);font-style:italic}
.ibtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:14px;
padding:3px 11px;font-size:12px;color:var(--brand);font-family:inherit;cursor:pointer;white-space:nowrap}
.ibtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ibtn.say{color:var(--brand2)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:24px 0}
.foot{text-align:center;font-size:12px;color:var(--sub);padding:6px 0 20px;line-height:1.7}
.draw{background:#FFF8E8;border-left:4px solid #E5A23C;border-radius:0 12px 12px 0;
padding:11px 13px;font-size:13px;color:#5A4A1E;margin-bottom:12px;line-height:1.7;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="d1">摘抄复盘 · 把抄过的变成能用的</div>
    <div class="d2">按主题翻 · 标用过 · 随机抽背</div>
    <div class="d3">「未用过」的句子才是你考前真正要背的。写进过作文的点一下「标为已用」，剩下就是漏洞。</div>
  </div>

  <div class="stats">
    <div class="stat"><b id="s1">0</b><span>累计</span></div>
    <div class="stat"><b id="s2">0</b><span>已用</span></div>
    <div class="stat"><b id="s3">0</b><span>未用</span></div>
    <div class="stat"><b id="s4">0</b><span>近7天</span></div>
  </div>

  <div class="draw" id="draw">🎲 抽签模式：下面 5 句是随机抽的，背完点「标为已用」，再抽下一组。</div>

  <div class="panel">
    <div class="pt">按大类复盘（数字 = 未用 / 总数）</div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="btn" id="bu" onclick="setUnused(!onlyUnused)">只看未用过</button>
      <button class="btn" id="dbtn" onclick="drawMode?drawMode=false,render():draw()">随机抽 5 句</button>
    </div>
    <div class="row">
      <input type="search" placeholder="搜句子或主题关键字…" oninput="setKw(this.value)">
    </div>
    <div class="row">
      <span class="dt" style="font-size:11.5px;color:var(--sub)">当前显示 <b id="cnt">0</b> 条 · 库内共 1010 条（页面只放最近 120 天）</span>
    </div>
  </div>

  <div id="list"></div>

  <div class="panel">
    <div class="pt">标记备份（换手机 / 清缓存不丢）</div>
    <div class="row">
      <button class="btn" onclick="exportUsed()">导出已用清单</button>
      <label class="btn" style="position:relative;overflow:hidden">导入恢复
        <input type="file" accept=".json" style="position:absolute;left:0;top:0;opacity:0;width:100%;height:100%"
               onchange="importUsed(this)"></label>
      <a class="btn" style="text-decoration:none" href="index.html">← 今日晨读包</a>
    </div>
  </div>

  <div class="foot">摘抄库随每日晨读包自动累积 · 更新于 2026-10-26 23:43<br>
  标记存在本机浏览器里，换设备记得先导出</div>
</div>

ics": ["系统思维"], "text": "在全局上谋势、关键处落子，确保牢牢掌握事业发展的领导权和主动权。", "src": "《人民日报》社论《齐心协力走好新的长征路》2026年10月22日01版"}, {"id": "611ada5a79", "date": "2026-10-23", "type": "短语", "big": "方法论·万能句", "topics": ["系统思维"], "text": "赢得战略主动，精神与智慧缺一不可：精神标定方向、筑牢定力，智慧明晰战略、开拓路径。", "src": "思想纵横《赢得战略主动 既靠精神也靠智慧》2026年10月22日06版"}, {"id": "499e178fe9", "date": "2026-10-23", "type": "短语", "big": "方法论·万能句", "topics": ["辩证思维"], "text": "离开了精神，再精妙的谋略也容易沦为投机算计；缺少了智慧，再高昂的斗志也容易变成盲目蛮干。", "src": "思想纵横《赢得战略主动 既靠精神也靠智慧》2026年10月22日06版"}, {"id": "c95a35240e", "date": "2026-10-23", "type": "短语", "big": "方法论·万能句", "topics": ["工作方法"], "text": "以群众体感为标尺，把小事做好、把规律摸透、把机制理顺、把普惠做实。", "src": "连线评论员《服务围人转，改革按需走》2026年10月22日05版"}, {"id": "227f1e00d0", "date": "2026-10-23", "type": "短语", "big": "方法论·万能句", "topics": ["久久为功"], "text": "小步快跑、及时纠偏，避免改革&quot;翻烧饼&quot;，让制度扎根乡土、经得起检验。", "src": "连线评论员《服务围人转，改革按需走》2026年10月22日05版"}, {"id": "96213a9e72", "date": "2026-10-23", "type": "短语", "big": "方法论·万能句", "topics": ["实干落实"], "text": "始终保持风雨浸衣骨更硬的坚韧，涵养万众一心加油干的勇毅，把科学规划变成务实行动，前行的路会越走越宽广。", "src": "评论员观察《长征之歌何以&quot;歌&quot;长征》2026年10月22日05版"}, {"id": "97fc09d95d", "date": "2026-10-22", "type": "金句", "big": "政绩观·党性修养", "topics": ["党性修养", "初心使命"], "text": "三种精神最核心的价值内涵，就是坚定的理想信念、绝对纯粹的政治忠诚、矢志不渝的初心使命。", "src": "《照金精神、长征精神和延安精神的内在逻辑与时代赓续》（王炳林），《人民日报》2026年10月21日09版"}, {"id": "e6ef7ec865", "date": "2026-10-22", "type": "金句", "big": "高质量发展·产业", "topics": ["高质量发展", "实干落实"], "text": "面对不确定性，练好内功、做强自身就是中国经济最大的确定性。", "src": "《深刻认识中国经济运行的三个突出特点》（金社平），《人民日报》2026年10月21日01版"}, {"id": "92c67dbb7b", "date": "2026-10-22", "type": "金句", "big": "生态文明·绿色发展", "topics": ["绿色发展", "系统思维"], "text": "统筹高质量发展和高水平保护，坚定不移走生态优先、绿色发展之路。", "src": "习近平在内蒙古乌兰察布考察时强调（《人民日报》2026年10月18日01版；甘肃省委常委会2026年10月21日传达学习）"}, {"id": "e3bebffc1d", "date": "2026-10-22", "type": "金句", "big": "文化·精神·文明", "topics": ["文化自信", "价值观"], "text": "心中有信仰，脚下有力量。", "src": "转引自《照金精神、长征精神和延安精神的内在逻辑与时代赓续》，《人民日报》2026年10月21日09版"}, {"id": "cba36ababb", "date": "2026-10-22", "type": "金句", "big": "治理·法治·安全 业", "topics": ["新质生产力", "系统思维"], "text": "中国经济呈现基础稳、优势多、韧性强、潜能大的鲜明特征，长期向好的支撑条件和基本趋势没有改变。", "src": "《深刻认识中国经济运行的三个突出特点》，同上01版"}, {"id": "11d63a3ec6", "date": "2026-10-22", "type": "短语", "big": "高质量发展·产业", "topics": ["高质量发展", "系统思维"], "text": "以高质量发展的确定性应对各种不确定性。", "src": "同上"}, {"id": "b0c9259ffe", "date": "2026-10-22", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育", "辩证思维"], "text": "重建禀赋认知，重构自身优势，才能打开转型新空间。（《被&quot;逼到墙角&quot;，就向新起跑（现场评论）》，同上05版）", "src": ""}, {"id": "e856ebc8d6", "date": "2026-10-22", "type": "短语", "big": "高质量发展·产业", "topics": ["高质量发展", "实干落实"], "text": "推动在建项目加快进度、新建项目开工建设，尽快形成更多实物工作量。", "src": "十四届甘肃省委常委会会议，2026年10月21日"}, {"id": "3aad25c32c", "date": "2026-10-22", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展", "生态修复"], "text": "昔日避之唯恐不及的荒漠，成了集发电、治沙、富民于一体的宝库。（《被&quot;逼到墙角&quot;，就向新起跑（现场评论）》）", "src": ""}, {"id": "15c635b597", "date": "2026-10-22", "type": "短语", "big": "生态文明·绿色发展", "topics": ["生态文明", "系统思维"], "text": "坚持山水林田湖草沙一体化保护和系统治理，不断巩固祁连山生态环境保护成果，坚决打好&quot;三北&quot;工程攻坚战。", "src": "十四届甘肃省委常委会会议，2026年10月21日"}, {"id": "fe60e43113", "date": "2026-10-22", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展", "能源转型"], "text": "牢固树立绿水青山就是金山银山理念，全面加快经济社会绿色低碳转型发展，坚定不移走生态优先、绿色发展之路。", "src": "同上"}, {"id": "5de4a75e35", "date": "2026-10-22", "type": "短语", "big": "治理·法治·安全", "topics": ["治理精度", "精准施策"], "text": "实现从粗放治理向精准治理的转变。（《以精准治理提升农村人居环境质量（有的放矢）》，同上09版）", "src": ""}, {"id": "2fc27477d2", "date": "2026-10-22", "type": "短语", "big": "治理·法治·安全", "topics": ["监管", "精准施策"], "text": "把握&quot;管太早&quot;与&quot;管太晚&quot;的平衡，关键是根据风险性质和技术成熟度，明确哪些要求必须先行。（《以标准建设护航前沿科创（人民时评）》）", "src": ""}, {"id": "87d7444edf", "date": "2026-10-22", "type": "短语", "big": "治理·法治·安全", "topics": ["应急管理", "治理精度"], "text": "不断提升预判的科学性、治理的有效性、处置的法治化。（《善待实干者 包容担当者（人民锐评）》）", "src": ""}, {"id": "ad4435aca2", "date": "2026-10-22", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信", "价值观"], "text": "精神的力量，穿越时空、激荡人心。（《中国精神何以立（评论员观察）》，同上05版）", "src": ""}, {"id": "3b1ab2cbdf", "date": "2026-10-22", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信", "价值观"], "text": "中国精神何以立？答案既在历史深处，也在亿万人民的烟火日常中。", "src": "同上"}, {"id": "840be87c59", "date": "2026-10-22", "type": "短语", "big": "文化·精神·文明", "topics": ["传统文化", "价值观"], "text": "传承精神不必重复前路，但须读懂前人的选择。", "src": "同上"}, {"id": "c5d76e4d41", "date": "2026-10-22", "type": "短语", "big": "开放·合作·全球治理", "topics": ["全球治理", "对外开放"], "text": "让更多中国方案上升为国际标准，就能更好把技术积累转化为规则影响力。（《以标准建设护航前沿科创（人民时评）》）", "src": ""}, {"id": "7b25599b95", "date": "2026-10-22", "type": "短语", "big": "开放·合作·全球治理", "topics": ["国际合作", "人类命运共同体"], "text": "在禀赋差异中加强经贸合作，在诉求差异中寻求共同利益，在文化差异中促进和合共生。（李强在上海合作组织成员国政府首脑（总理）理事会第二十五次会议上的讲话，2026年10月20日）", "src": ""}, {"id": "aac4233550", "date": "2026-10-22", "type": "短语", "big": "开放·合作·全球治理", "topics": ["对外开放", "全球治理"], "text": "在扩大开放中统筹用好两个市场、两种资源，着力强化甘肃在国家向西开放布局中的战略通道地位。", "src": "十四届甘肃省委常委会会议，2026年10月21日"}, {"id": "946c9428c7", "date": "2026-10-22", "type": "短语", "big": "方法论·万能句", "topics": ["辩证思维", "担当"], "text": "没有退路，反而逼出新路。（《被&quot;逼到墙角&quot;，就向新起跑（现场评论）》）", "src": ""}, {"id": "b35e52d448", "date": "2026-10-22", "type": "短语", "big": "方法论·万能句", "topics": ["辩证思维", "精准施策"], "text": "资源有限不可怕，怕的是自我设限。", "src": "同上"}, {"id": "45013a96ed", "date": "2026-10-22", "type": "短语", "big": "方法论·万能句", "topics": ["久久为功", "系统思维"], "text": "韧性并不是被动承受压力，而是在正视现实困难的基础上保持长期视野，通过学习、创新和调整，创造新的可能。（《长征具有跨越时代与国界的启示意义（国际论坛）》，《人民日报》2026年10月21日）", "src": ""}, {"id": "3302d8a10c", "date": "2026-10-22", "type": "短语", "big": "方法论·万能句", "topics": ["工作方法", "实干落实"], "text": "千方百计抢时间、赶进度、补缺口、挖潜力。", "src": "四川省委财经委员会第十四次会议，2026年10月21日"}, {"id": "171cb85454", "date": "2026-10-21", "type": "金句", "big": "文化·精神·文明", "topics": ["文化自信", "精神文明"], "text": "伟大长征精神，是中国共产党人及其领导的人民军队革命风范的生动反映，是中华民族自强不息的民族品格的集中展示，是以爱国主义为核心的民族精神的最高体现。", "src": "习近平，转引自《从万里长征走向伟大复兴》（《人民日报》2026年10月20日09版）"}, {"id": "80f0b4c9e5", "date": "2026-10-21", "type": "金句", "big": "创新·人才·教育", "topics": ["青年成长", "担当"], "text": "一代人有一代人的长征，一代人有一代人的担当。建成社会主义现代化强国，实现中华民族伟大复兴，是一场接力跑。", "src": "习近平，转引自同上"}, {"id": "7583f4c370", "date": "2026-10-21", "type": "金句", "big": "方法论·万能句", "topics": ["久久为功", "系统思维"], "text": "积小胜为大胜、积跬步至千里。", "src": "《从万里长征走向伟大复兴》（《人民日报》2026年10月20日09版）"}, {"id": "fada8b29ee", "date": "2026-10-21", "type": "金句", "big": "为民·民生·基层", "topics": ["民生保障", "兜底"], "text": "要大力发展普惠托育服务体系。", "src": "习近平，转引自《把握发展普惠托育和托幼一体化服务的着力点》（《人民日报》2026年10月20日09版）"}, {"id": "c8fec4f96b", "date": "2026-10-21", "type": "金句", "big": "开放·合作·全球治理", "topics": ["人类命运共同体", "对外开放"], "text": "中国原创技术在提升自身能力的同时，也为其他国家提供更多选择，是参与构建人类卫生健康共同体的切实行动。", "src": "《&quot;重病轻治&quot;的创新之道（微观）》（《人民日报》2026年10月20日05版）"}, {"id": "a3d3d2ed2e", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观", "担当"], "text": "平凡岗位可建不凡之功，无名坚守可成不朽之名。（《无名与有名（评论员观察）》，《人民日报》2026年10月20日05版）", "src": ""}, {"id": "085a76df8e", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观", "初心使命"], "text": "新时代的无名，是坚守初心的无我境界；新时代的有名，是创造业绩的功成有我。", "src": "同上"}, {"id": "93b25ba120", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["担当", "青年干部"], "text": "高质量发展呼唤&quot;十年磨一剑&quot;的执着，科技自立自强需要&quot;甘坐冷板凳&quot;的定力，乡村全面振兴亟待&quot;俯首甘为孺子牛&quot;的深耕。", "src": "同上"}, {"id": "b29e63c315", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观", "党性修养"], "text": "钝感，是对个人得失的淡然，是甘做铺垫工作、甘积尺寸之功、甘抓未成之事。（《&quot;在平时多做过细的群众工作&quot;（大家谈）》，同上05版）", "src": ""}, {"id": "2c251a8c19", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养", "廉洁作风"], "text": "不明确责任，不落实责任，不追究责任，从严治党是做不到的。（习近平，转引自《把管党治党政治责任落实好（金台潮声）》，同上19版）", "src": ""}, {"id": "31457ef1e5", "date": "2026-10-21", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养", "团结合作"], "text": "牢牢把握正确办学方向，持续加强政治培训，广泛凝聚政治共识。", "src": "习近平2026年10月20日致中央社会主义学院建院70周年贺信"}, {"id": "5be0ed6b69", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上", "初心使命"], "text": "许许多多无怨无悔、倾情奉献的无名英雄，他们以普通人的平凡书写了不平凡的人生。（习近平，转引自《无名与有名（评论员观察）》）", "src": ""}, {"id": "4d7e810bd6", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作", "基层治理"], "text": "敏感，是对群众冷暖、风险隐患的敏锐，是见事早、行动快。（《&quot;在平时多做过细的群众工作&quot;（大家谈）》）", "src": ""}, {"id": "a7809fca54", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作", "调查研究"], "text": "多向群众&quot;取经&quot;，才能把工作干到群众心坎上。", "src": "同上"}, {"id": "dc020dff37", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作", "基层治理"], "text": "先与群众共情，感情拉近了，工作才好做。（《统筹基层工作的&quot;跳进去&quot;与&quot;领出来&quot;（思想纵横）》，同上09版）", "src": ""}, {"id": "2189bfa6a9", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作", "担当"], "text": "把群众&quot;盼的事&quot;变成手中&quot;干的事&quot;，把&quot;闹心事&quot;办成&quot;舒心事&quot;。", "src": "同上"}, {"id": "a67c94e619", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上", "群众工作"], "text": "我们共产党的各级干部到哪都要问一声乡亲们：还想过什么样的好生活？更好的生活，我们一起来推动、来实现。", "src": "习近平，转引自《弘扬伟大长征精神 走好今天的长征路》，同上01版"}, {"id": "4b98608871", "date": "2026-10-21", "type": "短语", "big": "为民·民生·基层", "topics": ["民生保障", "公共服务"], "text": "普惠托育需坚持公共利益优先，保基本、兜底线、促公平。（《把握发展普惠托育和托幼一体化服务的着力点（有的放矢）》，同上09版）", "src": ""}, {"id": "e53f99b246", "date": "2026-10-21", "type": "短语", "big": "创新·人才·教育", "topics": ["人才评价", "科研生态"], "text": "合肥这个地方是&quot;养人&quot;的，培养出了这么多优秀人才，是创新的天地。（习近平2016年4月26日在中国科学技术大学考察时的讲话，转引自《这个地方何以&quot;养人&quot;》，同上19版）", "src": ""}, {"id": "a99d57c6d2", "date": "2026-10-21", "type": "短语", "big": "创新·人才·教育", "topics": ["人才评价", "营商环境"], "text": "打破户籍、地域、人事关系等限制，让拥有多年科研和工程实践经验的科研人员继续在产业一线发挥专业能力。", "src": "同上"}, {"id": "4ff4f1f154", "date": "2026-10-21", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新", "自立自强"], "text": "要把满足人民对美好生活的向往作为科技创新的落脚点。（习近平，转引自《&quot;重病轻治&quot;的创新之道（微观）》，同上05版）", "src": ""}, {"id": "9ddfd87104", "date": "2026-10-21", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新", "科研生态"], "text": "现实难题常常跨越学科边界，解题也需打通知识之间的壁垒。", "src": "同上"}, {"id": "04f9dbdb9a", "date": "2026-10-21", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新", "公共服务"], "text": "高精尖与广覆盖并不矛盾，让更多人方便使用，本身就是值得投入的创新课题。", "src": "同上"}, {"id": "cc4635ce78", "date": "2026-10-21", "type": "短语", "big": "高质量发展·产业", "topics": ["数字经济", "新质生产力"], "text": "智能经济不是简单给经济运行&quot;装AI插件&quot;，而是通过数据流动、自动响应和实时优化，对生产、流通、消费进行智能化重构。（《让智能经济更好激发新动能（人民时评）》，同上05版）", "src": ""}, {"id": "5fd9f400b9", "date": "2026-10-21", "type": "短语", "big": "高质量发展·产业", "topics": ["新质生产力", "精准施策"], "text": "智能经济的含金量，最终要体现在车间的报表上、工厂的产能里、亿万用户真实的获得感中。", "src": "同上"}, {"id": "a611c69b23", "date": "2026-10-21", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育", "新质生产力"], "text": "传统产业经过改造提升同样能跻身先进制造业行列。（敖鸿《坚持智能化绿色化融合化方向，全力推动贵州先进制造业高质量发展》，2026年10月19日）", "src": ""}, {"id": "02428801fc", "date": "2026-10-21", "type": "短语", "big": "高质量发展·产业", "topics": ["高质量发展", "产业培育"], "text": "以提质增效为目标、以增强核心功能为重点、以破除体制机制障碍为突破口。", "src": "王晓晖2026年10月20日在全省进一步深化国资国企改革工作推进会议上的讲话"}, {"id": "4233e0b6ef", "date": "2026-10-21", "type": "短语", "big": "生态文明·绿色发展", "topics": ["能源转型", "绿色发展"], "text": "要积极推进燃煤机组改造升级，持续降低能耗、排放、污染，助力绿色低碳转型。", "src": "林武2026年10月20日在聊城市调研时的讲话"}, {"id": "5fe9ab2dcd", "date": "2026-10-21", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展", "系统思维"], "text": "坚持激励与约束并重，统筹产业结构调整、污染治理、生态保护、应对气候变化，协同推进降碳、减污、扩绿、增长。（《美丽四川建设&quot;十五五&quot;规划》，川府发〔2026〕20号，2026年10月9日印发）", "src": ""}, {"id": "8c81e9b106", "date": "2026-10-21", "type": "短语", "big": "治理·法治·安全", "topics": ["法治", "监管"], "text": "有权必有责、有责要担当、失责必追究。（《把管党治党政治责任落实好（金台潮声）》）", "src": ""}, {"id": "ba5c7dae6e", "date": "2026-10-21", "type": "短语", "big": "治理·法治·安全", "topics": ["监管", "系统思维"], "text": "只有责任环环相扣、压力层层传导，才能确保每个责任主体各司其职、各负其责。", "src": "同上"}, {"id": "78287a2764", "date": "2026-10-21", "type": "短语", "big": "治理·法治·安全", "topics": ["风险防控", "治理精度"], "text": "把功夫下在看不见处，把责任落在每一个细节，方能把工作做好、让群众满意。（《&quot;在平时多做过细的群众工作&quot;（大家谈）》）", "src": ""}, {"id": "bfafe43240", "date": "2026-10-21", "type": "短语", "big": "治理·法治·安全", "topics": ["监管", "风险防控"], "text": "在坚守质量和安全底线前提下为创新留足发展空间，严禁放任不管或简单封杀。", "src": "国家发展改革委2026年10月20日新闻发布会"}, {"id": "dfe8807b1a", "date": "2026-10-21", "type": "短语", "big": "文化·精神·文明", "topics": ["精神文明", "久久为功"], "text": "民族复兴绝非朝夕之功、一蹴而就，必须保持历史耐心、战略定力，一步一个脚印走、一茬接着一茬干。", "src": "《从万里长征走向伟大复兴》，《人民日报》2026年10月20日09版"}, {"id": "b65a9322ff", "date": "2026-10-21", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信", "价值观"], "text": "实现伟大的理想，没有平坦的大道可走。", "src": "同上"}, {"id": "2a08085b16", "date": "2026-10-21", "type": "短语", "big": "文化·精神·文明", "topics": ["传统文化", "初心使命"], "text": "共产党人和老百姓的感情就是共用一条被子的感情。", "src": "习近平，转引自同上"}, {"id": "d802d37c44", "date": "2026-10-21", "type": "短语", "big": "开放·合作·全球治理", "topics": ["对外开放", "团结合作"], "text": "先进技术的推广应用，没有国界。（《&quot;重病轻治&quot;的创新之道（微观）》）", "src": ""}, {"id": "8ec8b4425e", "date": "2026-10-21", "type": "短语", "big": "开放·合作·全球治理", "topics": ["全球治理", "团结合作"], "text": "开放数据、交流标准、培养人才，使合作从提供一项成果延伸到帮助形成应用能力。", "src": "同上"}, {"id": "f5dde91c6c", "date": "2026-10-21", "type": "短语", "big": "开放·合作·全球治理", "topics": ["对外开放", "全球治理"], "text": "从&quot;中国项目&quot;到&quot;全球经验&quot;。（《人民日报》2026年10月20日02版，新开发银行发布首份《中国国别项目组合评价报告》）", "src": ""}, {"id": "8855782532", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["辩证思维", "工作方法"], "text": "别把熟悉当正确，别把改进当突破——回到起始点，攻克薄弱点，就能打开全新空间。（《&quot;重病轻治&quot;的创新之道（微观）》）", "src": ""}, {"id": "64eb50eff1", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["久久为功", "系统思维"], "text": "基础设施先行、应用场景跟进、组织方式适应、整体效率提升，是技术从诞生到成熟的普遍路径。（《让智能经济更好激发新动能（人民时评）》）", "src": ""}, {"id": "3c6e07fd35", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["工作方法", "政绩观"], "text": "敏感于事，钝感于己，基层干部当有这样的胸怀和担当。（《&quot;在平时多做过细的群众工作&quot;（大家谈）》）", "src": ""}, {"id": "00266f0526", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["精准施策", "政绩观"], "text": "确保新质生产力发展不走偏、不冒进、不泡沫化。", "src": "《中共中央 国务院关于发展新质生产力的意见》，2026年10月印发"}, {"id": "92da0e2652", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["精准施策", "工作方法"], "text": "有的放矢把确定性工作做到位，以最大努力争取最好结果。", "src": "十四届甘肃省政府第139次常务会议，2026年10月20日"}, {"id": "2f817fb095", "date": "2026-10-21", "type": "短语", "big": "方法论·万能句", "topics": ["精准施策", "系统思维"], "text": "发展新质生产力，因地制宜既是立足各地资源禀赋、防止同质化竞争的硬性工作要求，也是尊重区域发展差异、把各地比较优势转化为发展实效的科学方法论。（国家发展改革委创新和高技术发展司副司长任中保，2026年10月20日新闻发布会）", "src": ""}, {"id": "c0a10a4d17", "date": "2026-10-20", "type": "金句", "big": "创新·人才·教育", "topics": ["自立自强", "科技创新"], "text": "推动科技创新和产业创新深度融合。这是以高水平科技自立自强引领发展新质生产力的关键。要突出科技创新供给和产业需求牵引，推动产学研融通创新，打通科技加速向现实生产力转化的通道。", "src": "习近平2026年7月8日在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话（学习强国每日金句，2026年10月19日）"}, {"id": "dac1e52875", "date": "2026-10-20", "type": "金句", "big": "治理·法治·安全", "topics": ["廉洁作风", "监管"], "text": "反腐败是一场输不起也决不能输的重大斗争，一刻不能停、半步不能退。", "src": "习近平《以更高标准、更实举措推进全面从严治党》，《求是》2026年第20期"}, {"id": "2afedd6284", "date": "2026-10-20", "type": "金句", "big": "政绩观·党性修养", "topics": ["政绩观", "系统思维"], "text": "要按照党中央战略决策和规划部署，树立和践行正确政绩观，完整准确全面贯彻新发展理念，紧跟时代潮流、抢抓发展机遇，立足自身条件、发挥比较优势，因地制宜推动高质量发展。", "src": "习近平2026年10月16日在内蒙古乌兰察布考察时的讲话（新华社《登高望远处，风光正无限》，《光明日报》2026年10月19日01版）"}, {"id": "0d504e0881", "date": "2026-10-20", "type": "金句", "big": "文化·精神·文明", "topics": ["精神文明", "初心使命"], "text": "一切向前走，都不能忘记走过的路，都不能忘记为什么出发。", "src": "钟华论《在新的长征路上继续奋勇前进》，新华社2026年10月19日"}, {"id": "05ecfa515c", "date": "2026-10-20", "type": "金句", "big": "方法论·万能句", "topics": ["系统思维", "担当"], "text": "推进中国式现代化，是一项前无古人的开创性事业，必然会遇到各种可以预料和难以预料的风险挑战、艰难险阻甚至惊涛骇浪。", "src": "钟华论《在新的长征路上继续奋勇前进》，新华社2026年10月19日"}, {"id": "efc138a7a4", "date": "2026-10-20", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养", "初心使命"], "text": "以党的初心为本心、以党的使命为生命，把全部智慧和力量凝聚到实现党的中心任务上来。", "src": "习近平《以更高标准、更实举措推进全面从严治党》，《求是》2026年第20期"}, {"id": "753ce59258", "date": "2026-10-20", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观", "党性修养"], "text": "以功成不必在我、功成必定有我的精神境界，心无旁骛推进中国式现代化。", "src": "同上"}, {"id": "28db8bddc6", "date": "2026-10-20", "type": "短语", "big": "政绩观·党性修养", "topics": ["廉洁作风", "党性修养"], "text": "落实中央八项规定精神没有捷径，关键就在常、长二字，不经常抓容易出现反复，不长期抓难以形成自觉。", "src": "同上"}, {"id": "9250f3a9bd", "date": "2026-10-20", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上", "群众工作"], "text": "人民群众有着无尽的智慧和力量，只有始终相信人民，紧紧依靠人民，充分调动广大人民的积极性、主动性、创造性，才能凝聚起众志成城的磅礴之力。（习近平，转引自《&quot;广大人民群众是长征胜利的力量源泉&quot;》，《人民日报》2026年10月19日01版）", "src": ""}, {"id": "9da037b84b", "date": "2026-10-20", "type": "短语", "big": "为民·民生·基层", "topics": ["公共服务", "民生保障"], "text": "保持清醒判断，才能看穿营销陷阱；具备科学素养，才能避开认知误区。（《当好自己健康的&quot;主理人&quot;（人民时评）》，《人民日报》2026年10月19日05版）", "src": ""}, {"id": "072eca98cd", "date": "2026-10-20", "type": "短语", "big": "为民·民生·基层", "topics": ["公共服务", "兜底"], "text": "既&quot;治已病&quot;，也&quot;防未病&quot;，在健康中国战略统筹下，以健康为中心的理念正助力越来越多人远离疾病、享受幸福。", "src": "同上"}, {"id": "1665f17f42", "date": "2026-10-20", "type": "短语", "big": "创新·人才·教育", "topics": ["青年成长", "担当"], "text": "不负韶华，不负时代，不负人民，在青春的赛道上奋力奔跑，争取跑出当代青年的最好成绩。", "src": "钟华论《在新的长征路上继续奋勇前进》，新华社2026年10月19日"}, {"id": "d776a1f529", "date": "2026-10-20", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新", "自立自强"], "text": "逐梦星辰大海、勇攀创新高峰，是广大青年科技工作者们不懈的追求。", "src": "同上"}, {"id": "b7a11b8298", "date": "2026-10-20", "type": "短语", "big": "高质量发展·产业", "topics": ["高质量发展", "精准施策"], "text": "县域经济发展得好不好、强不强，关键在于能不能做到因地制宜，有没有抓住&quot;特&quot;字做文章。", "src": "叶振宇《因地制宜推动县域经济高质量发展》，人民论坛网2026年10月19日"}, {"id": "3d7c3a7789", "date": "2026-10-20", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育", "新质生产力"], "text": "要把特色产业发展壮大为特色优势产业，关键在创新，包括商业模式创新、业态创新、装备或工艺技术创新。", "src": "同上"}, {"id": "06175956f5", "date": "2026-10-20", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育", "就业"], "text": "做强做大县域优势特色产业，使之成为吸引本地人就业的&quot;蓄水池&quot;。", "src": "同上"}, {"id": "a372bfc2df", "date": "2026-10-20", "type": "短语", "big": "高质量发展·产业", "topics": ["数字经济", "营商环境"], "text": "推动智能消费设施和服务向县域延伸，完善县域智能产品服务网络，激发下沉市场活力。", "src": "《商务部等9部门关于加快推进科技兴商的意见》，2026年10月19日发布"}, {"id": "1bfa116fd6", "date": "2026-10-20", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展", "辩证思维"], "text": "统筹生态保护与文旅发展，实现生态效益、社会效益有机统一。", "src": "自治区党委书记陈刚2026年10月19日在河池市凤山县督导调研时的讲话"}, {"id": "0d72e28cfd", "date": "2026-10-20", "type": "短语", "big": "生态文明·绿色发展", "topics": ["生态文明", "监管"], "text": "新账旧账一起算，拉网式排查整治，全力清零存量问题，坚决遏制增量问题。", "src": "同上"}, {"id": "941e19cd66", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["法治", "监管"], "text": "确保制度规定真正成为带电的高压线。", "src": "习近平《以更高标准、更实举措推进全面从严治党》，《求是》2026年第20期"}, {"id": "1fb0438c50", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["法治", "监管"], "text": "明规矩不彰，潜规则必然盛行；潜规则大行其道，明规矩就会沦为摆设。", "src": "同上"}, {"id": "590e81daed", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["监管", "法治"], "text": "遏制潜规则，关键在于提升明规矩的执行力，真正让权力在阳光下运行。", "src": "同上"}, {"id": "6e07edb253", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["监管", "系统思维"], "text": "统筹用好全面监督的&quot;无影灯&quot;和强力办案的&quot;手术刀&quot;，以全链条协作促进一体化治理。", "src": "同上"}, {"id": "bb62ed8aed", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["安全观", "系统思维"], "text": "完善全量全要素全生命周期风险监测预警响应体系，健全基层协同治理机制，推动风险隐患全量排查、闭环管控。（重庆市委理论学习中心组专题学习会，2026年10月19日）", "src": ""}, {"id": "f3df7e82c6", "date": "2026-10-20", "type": "短语", "big": "治理·法治·安全", "topics": ["风险防控", "应急管理"], "text": "推动风险隐患全量全要素全生命周期闭环管控，构建&quot;人防+技防+智防&quot;融合防控体系。", "src": "重庆市委书记袁家军2026年10月19日在数字重庆建设推进会上的讲话"}, {"id": "8be7286012", "date": "2026-10-20", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信", "传统文化"], "text": "文化亘古亘新。中华优秀传统文化以鲜活姿态融入当代生活，显示出别样生机与活力，关键在于&quot;第二个结合&quot;。（《千年文脉何以新（评论员观察）》，《人民日报》2026年10月19日05版）", "src": ""}, {"id": "a3569c1f32", "date": "2026-10-20", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信", "传统文化"], "text": "&quot;结合&quot;不是&quot;拼盘&quot;，不是简单的&quot;物理反应&quot;，而是深刻的&quot;化学反应&quot;。", "src": "同上"}, {"id": "754529b2b4", "date": "2026-10-20", "type": "短语", "big": "文化·精神·文明", "topics": ["传统文化", "文化自信"], "text": "文化赋能高质量发展，在&quot;形&quot;更在&quot;魂&quot;。", "src": "同上"}, {"id": "b387d342de", "date": "2026-10-20", "type": "短语", "big": "文化·精神·文明", "topics": ["精神文明", "价值观"], "text": "长征最动人的，不是天生英雄的故事，而是普通人在绝境中的不普通选择。（《长征精神何以穿越时空、历久弥新（人民论坛）》，《人民日报》2026年10月19日04版）", "src": ""}, {"id": "1cbf6408a7", "date": "2026-10-2 var BIG_ORDER = ["政绩观·党性修养", "为民·民生·基层", "创新·人才·教育", "高质量发展·产业", "生态文明·绿色发展", "治理·法治·安全", "文化·精神·文明", "开放·合作·全球治理", "方法论·万能句", "政治民生", "文化", "乡村振兴", "行政执法", "生态", "科技", "经济", "背景句", "过渡句", "人生哲理", "其他·待归类"];
var USED = {};
try { USED = JSON.parse(localStorage.getItem('rv_used') || '{}'); } catch (e) { USED = {}; }
function save() { try { localStorage.setItem('rv_used', JSON.stringify(USED)); } catch (e) {} }
var topic = '__all__', onlyUnused = false, kw = '', drawMode = false, drawIds = [];

function esc(s){return s;}
function el(id){return document.getElementById(id);}

function bigList() {
  var m = {};
  DATA.forEach(function (d) {
    if (!m[d.big]) m[d.big] = { t: 0, u: 0 };
    m[d.big].t++;
    if (!USED[d.id]) m[d.big].u++;
  });
  var a = [];
  BIG_ORDER.forEach(function (b) { if (m[b]) a.push([b, m[b].u, m[b].t]); });
  Object.keys(m).forEach(function (k) { if (BIG_ORDER.indexOf(k) < 0) a.push([k, m[k].u, m[k].t]); });
  return a;
}
function renderChips() {
  var un = DATA.filter(function (d) { return !USED[d.id]; }).length;
  var h = '<div class="chip' + (topic === '__all__' ? ' on' : '') + '" onclick="setTopic(\'__all__\')">全部<i>' + un + '/' + DATA.length + '</i></div>';
  bigList().forEach(function (p) {
    h += '<div class="chip' + (topic === p[0] ? ' on' : '') + '" onclick="setTopic(\'' + p[0].replace(/'/g, '') + '\')">' + p[0] + '<i>' + p[1] + '/' + p[2] + '</i></div>';
  });
  el('chips').innerHTML = h;
}
function setTopic(t) { topic = t; drawMode = false; render(); }
function setUnused(b) { onlyUnused = b; el('bu').className = 'btn' + (b ? ' on' : ''); drawMode = false; render(); }
function setKw(v) { kw = v.trim(); drawMode = false; render(); }
function toggle(id) {
  if (USED[id]) delete USED[id]; else USED[id] = 1;
  save(); render();
}
function match(d) {
  if (topic !== '__all__' && d.big !== topic) return false;
  if (onlyUnused && USED[d.id]) return false;
  if (kw && d.text.indexOf(kw) < 0 && d.topics.join('').indexOf(kw) < 0 && d.big.indexOf(kw) < 0) return false;
  return true;
}
function say(btn, txt) {
  if (!('speechSynthesis' in window)) { btn.textContent = '不支持'; return; }
  if (window.__spk === btn) { window.speechSynthesis.cancel(); btn.textContent = '🔊'; window.__spk = null; return; }
  window.speechSynthesis.cancel();
  if (window.__spk) window.__spk.textContent = '🔊';
  var u = new SpeechSynthesisUtterance(txt);
  u.lang = 'zh-CN'; u.rate = 0.92;
  u.onend = function () { btn.textContent = '🔊'; window.__spk = null; };
  btn.textContent = '■'; window.__spk = btn;
  window.speechSynthesis.speak(u);
}
function draw() {
  var pool = DATA.filter(function (d) { return match(d) && !USED[d.id]; });
  if (pool.length === 0) { alert('当前筛选下没有未用过的句子'); return; }
  pool.sort(function () { return Math.random() - 0.5; });
  drawIds = pool.slice(0, 5).map(function (d) { return d.id; });
  drawMode = true; render();
  window.scrollTo(0, 0);
}
function stat() {
  var u = 0, w = 0;
  var today = new Date();
  DATA.forEach(function (d) {
    if (USED[d.id]) u++;
    var dd = new Date(d.date);
    if ((today - dd) / 86400000 <= 7) w++;
  });
  el('s1').textContent = DATA.length;
  el('s2').textContent = u;
  el('s3').textContent = DATA.length - u;
  el('s4').textContent = w;
}
function render() {
  stat(); renderChips();
  var list = DATA.filter(function (d) { return drawMode ? drawIds.indexOf(d.id) >= 0 : match(d); });
  var h = '';
  list.forEach(function (d) {
    var tg = '<span class="tag big">' + d.big + '</span>'
      + d.topics.map(function (t) { return '<span class="tag sm">' + t + '</span>'; }).join('');
    h += '<div class="it' + (USED[d.id] ? ' used' : '') + (d.type === '短语' ? ' phrase' : '') + '">'
      + '<div class="tx">' + d.text + '</div><div class="mt">' + tg
      + '<span class="dt">' + d.date.slice(5) + ' · ' + d.type + '</span>'
      + (d.src ? '<span class="src">' + d.src + '</span>' : '')
      + '<button class="ibtn say" onclick="say(this, this.parentNode.parentNode.querySelector(\'.tx\').innerText)">🔊</button>'
      + '<button class="ibtn' + (USED[d.id] ? ' on' : '') + '" onclick="toggle(\'' + d.id + '\')">'
      + (USED[d.id] ? '已用过 ✓' : '标为已用') + '</button></div></div>';
  });
  if (!h) h = '<div class="empty">没有符合条件的句子</div>';
  el('list').innerHTML = h;
  el('cnt').textContent = list.length;
  el('draw').style.display = drawMode ? 'block' : 'none';
  el('dbtn').textContent = drawMode ? '退出抽签' : '随机抽 5 句';
}
function exportUsed() {
  var blob = new Blob([JSON.stringify({ used: USED, at: new Date().toISOString() }, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '摘抄已用清单.json';
  a.click();
}
function importUsed(inp) {
  var f = inp.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var o = JSON.parse(r.result);
      USED = o.used || o;
      save(); render(); alert('已恢复 ' + Object.keys(USED).length + ' 条标记');
    } catch (e) { alert('文件格式不对'); }
  };
  r.readAsText(f);
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('../sw.js').catch(function () {}); });
}
render();
</script>

<html lang="zh-CN">
<head>

<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#1B2430;--sub:#7A869A;--line:#EAEEF4;
--brand:#1F3864;--brand2:#3A6EAF;--accent:#2E9E6B;--warn:#C0563B;--r:16px;
--sh:0 2px 10px rgba(24,40,70,.06);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 0}
.hero{background:linear-gradient(135deg,#24406E,#1F3864);color:#fff;border-radius:20px;
padding:16px 18px;box-shadow:0 6px 18px rgba(31,56,100,.22);margin-bottom:12px}
.hero .d1{font-size:13px;opacity:.85;letter-spacing:.5px}
.hero .d2{font-size:20px;font-weight:700;margin-top:2px}
.hero .d3{font-size:12.5px;opacity:.82;margin-top:5px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:10px 6px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--brand);line-height:1.2}
.stat span{font-size:11.5px;color:var(--sub)}
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:12px}
.panel .pt{font-size:13.5px;font-weight:700;color:var(--brand);margin-bottom:8px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;background:#EAF2FB;color:var(--brand2);border-radius:16px;padding:5px 12px;
font-size:12.5px;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);color:#fff}
.chip i{font-style:normal;opacity:.65;margin-left:3px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{background:#fff;border:1px solid var(--line);color:var(--brand);border-radius:18px;
padding:7px 13px;font-size:13px;font-weight:600;font-family:inherit;box-shadow:var(--sh);cursor:pointer}
.btn:active{background:#EEF2F8}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=search]{flex:1;min-width:150px;border:1px solid var(--line);border-radius:18px;
padding:7px 13px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff}
.it{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:13px 15px;margin-bottom:10px;

.it.used{opacity:.5;border-left-color:#C9D2E0}
.it.phrase{border-left-color:#E5A23C}
.it .tx{font-size:15.3px;line-height:1.85;color:#243247}
.it.phrase .tx{font-size:14.5px;color:#5A4A1E}
.it .mt{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}
.tag{display:inline-block;background:#EAF2FB;color:var(--brand2);border-radius:6px;
padding:1px 7px;font-size:12px;font-weight:700}
.tag.big{background:var(--brand);color:#fff}
.tag.sm{background:#F2F5F9;color:#8A94A6;font-weight:500;font-size:11.5px}
.it .dt{font-size:11.5px;color:var(--sub)}
.it .src{font-size:11.5px;color:var(--sub);font-style:italic}
.ibtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:14px;
padding:3px 11px;font-size:12px;color:var(--brand);font-family:inherit;cursor:pointer;white-space:nowrap}
.ibtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ibtn.say{color:var(--brand2)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:24px 0}
.foot{text-align:center;font-size:12px;color:var(--sub);padding:6px 0 20px;line-height:1.7}
.draw{background:#FFF8E8;border-left:4px solid #E5A23C;border-radius:0 12px 12px 0;
padding:11px 13px;font-size:13px;color:#5A4A1E;margin-bottom:12px;line-height:1.7;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="d1">摘抄复盘 · 把抄过的变成能用的</div>
    <div class="d2">按主题翻 · 标用过 · 随机抽背</div>
    <div class="d3">「未用过」的句子才是你考前真正要背的。写进过作文的点一下「标为已用」，剩下就是漏洞。</div>
  </div>

  <div class="stats">
    <div class="stat"><b id="s1">0</b><span>累计</span></div>
    <div class="stat"><b id="s2">0</b><span>已用</span></div>
    <div class="stat"><b id="s3">0</b><span>未用</span></div>
    <div class="stat"><b id="s4">0</b><span>近7天</span></div>
  </div>

  <div class="draw" id="draw">🎲 抽签模式：下面 5 句是随机抽的，背完点「标为已用」，再抽下一组。</div>

  <div class="panel">
    <div class="pt">按大类复盘（数字 = 未用 / 总数）</div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="btn" id="bu" onclick="setUnused(!onlyUnused)">只看未用过</button>
      <button class="btn" id="dbtn" onclick="drawMode?drawMode=false,render():draw()">随机抽 5 句</button>
    </div>
    <div class="row">
      <input type="search" placeholder="搜句子或主题关键字…" oninput="setKw(this.value)">
    </div>
    <div class="row">
      <span class="dt" style="font-size:11.5px;color:var(--sub)">当前显示 <b id="cnt">0</b> 条 · 库内共 1744 条（页面只放最近 120 天）</span>
    </div>
  </div>

  <div id="list"></div>

  <div class="panel">
    <div class="pt">标记备份（换手机 / 清缓存不丢）</div>
    <div class="row">
      <button class="btn" onclick="exportUsed()">导出已用清单</button>
      <label class="btn" style="position:relative;overflow:hidden">导入恢复
        <input type="file" accept=".json" style="position:absolute;left:0;top:0;opacity:0;width:100%;height:100%"
               onchange="importUsed(this)"></label>
      <a class="btn" style="text-decoration:none" href="index.html">← 今日晨读包</a>
    </div>
  </div>

  <div class="foot">摘抄库随每日晨读包自动累积 · 更新于 2026-11-27 23:55<br>
  标记存在本机浏览器里，换设备记得先导出</div>
</div>

": "&quot;内卷&quot;没有出路，与其盲目跟风，不如精准谋划、精准施策、精准发力。", "src": "同上"}, {"id": "316a084d47", "date": "2026-10-29", "type": "短语", "big": "方法论·万能句", "topics": ["系统思维"], "text": "新质生产力的培育，不能靠&quot;复制粘贴&quot;的照搬照抄，而是需要立足全局所需、结合一域所能，实现&quot;量体裁衣&quot;。", "src": "同上"}, {"id": "d03fe3a328", "date": "2026-10-29", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育"], "text": "打破&quot;捡到篮里都是菜&quot;的思维，善于在大局中找准定位，方能构筑起产业发展优势。", "src": "同上"}, {"id": "4e92433fbf", "date": "2026-10-29", "type": "短语", "big": "高质量发展·产业", "topics": ["新质生产力"], "text": "特色就是潜力、竞争力。扬长避短，后发地区、传统产业同样可以发掘人无我有的独特发展路径。", "src": "同上"}, {"id": "ecf969d0b1", "date": "2026-10-29", "type": "短语", "big": "高质量发展·产业", "topics": ["新质生产力"], "text": "培育新质生产力，没有标准答案、固定模式。避免一哄而上、跟风冒进，关键在思路。", "src": "同上"}, {"id": "5653018b42", "date": "2026-10-29", "type": "短语", "big": "高质量发展·产业", "topics": ["数字经济"], "text": "数据和算法成了新农资。（同上，云南高原特色农业一颗樱桃番茄的数字化精准管理）", "src": ""}, {"id": "38c3d691fd", "date": "2026-10-29", "type": "短语", "big": "生态文明·绿色发展", "topics": ["能源转型"], "text": "戈壁滩上，一座座数据中心拔地而起，西北多地依托风光资源优势，发展&quot;绿电＋算力&quot;新业态，让&quot;瓦特&quot;变&quot;比特&quot;。", "src": "同上"}, {"id": "5596d3e091", "date": "2026-10-29", "type": "短语", "big": "开放·合作·全球治理", "topics": ["团结合作"], "text": "他者既可以是一地的竞争者，也可以成为发展的合作者。", "src": "同上"}, {"id": "7deba595a1", "date": "2026-10-29", "type": "短语", "big": "开放·合作·全球治理", "topics": ["团结合作"], "text": "跳出常规视角，以协同思维看待一地与他者的关系，找到合作的生长点，取彼之长，补己之短，就能打开发展新天地。", "src": "同上"}, {"id": "494cd377ed", "date": "2026-10-29", "type": "短语", "big": "政绩观·党性修养", "topics": ["初心使命"], "text": "党的各级组织都健全、都过硬，每名党员的作用都充分发挥出来，群众的获得感、幸福感、安全感就有了坚实依托。（邹翔《&quot;组织链&quot;里见力量（评论员观察）》，《人民日报》2026年10月28日 05 版）", "src": ""}, {"id": "f3319b68d4", "date": "2026-10-29", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "组织优势是制胜法宝，也是看得见的战斗力、摸得着的生产力。", "src": "同上"}, {"id": "89bb477a95", "date": "2026-10-29", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观"], "text": "业有远近，功有潜显。（《深耕潜绩 固本致远（思想纵横）》，《人民日报》2026年10月28日 09 版）", "src": ""}, {"id": "b1 , "type": "金句", "big": "创新·人才·教育", "topics": ["科技创新"], "text": "我国很多重大科技成果都是依靠这个法宝搞出来的，千万不能丢了！", "src": "习近平论集中力量办大事（转引自任仲平，2026年10月26日 01 版）"}, {"id": "fdfd99d629", "date": "2026-10-27", "type": "金句", "big": "政绩观·党性修养", "topics": ["初心使命"], "text": "要砥砺初心使命，持之以恒、久久为功，继续回答好延安&#x27;窑洞之问&#x27;。", "src": "习近平 2026年新年贺词（转引自《人民日报》2026年10月26日 01 版述评）"}, {"id": "427961cc43", "date": "2026-10-27", "type": "金句", "big": "高质量发展·产业", "topics": ["高质量发展"], "text": "到本世纪中叶，我们要全面建成社会主义现代化强国、实现第二个百年奋斗目标。时间不等人！历史不等人！", "src": "习近平 2026年&quot;七一&quot;重要讲话（转引自任仲平，2026年10月26日 01 版）"}, {"id": "b5b1c895f7", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "治国必先治党，治党务必从严。（任仲平《在新征程上持之以恒推进全面从严治党》，《人民日报》2026年10月26日 01 版）", "src": ""}, {"id": "9425084b93", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "办好中国的事情，关键在党，关键在党要管党、全面从严治党。", "src": "张洋、孟祥夫《不断开创新时代管党治党、兴党强党新局面》，同上 01 版"}, {"id": "1c501adecc", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "全面从严治党永远在路上。这不是&quot;一阵风&quot;，不能&quot;歇歇脚&quot;，而是久久为功的行动。", "src": "同上"}, {"id": "4c5f969c9a", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "我们党之所以伟大，不在于不犯错误，而在于从不讳疾忌医。", "src": "习近平，转引自上稿"}, {"id": "8c16af1172", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["廉洁作风"], "text": "无私者无畏，我们党没有任何自己特殊的利益，这是我们党敢于刀刃向内的勇气之源、底气所在。", "src": "同上"}, {"id": "e045338621", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["担当"], "text": "使命越光荣，任务越艰巨，越需要自身过硬。", "src": "同上"}, {"id": "02b59d027f", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "敢管敢严、真管真严、长管长严。", "src": "同上"}, {"id": "f055b53de0", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "善于以时代发展要求审视自己、以强烈忧患意识警醒自己、以自我革命精神完善自己。", "src": "同上"}, {"id": "06f4f93c76", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "全面从严治党不止于正风肃纪、激浊扬清，更重塑了党的精气神、锻造了坚强的领导力。（《锻造&quot;实现愿景的非凡能力&quot;（评论员观察）》，2026年10月26日 05 版）", "src": ""}, {"id": "f146889dc0", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["政绩观"], "text": "让&quot;立党为公、为民造福、科学决策、真抓实干&quot;成为履职尽责的总要求。（01 版述评，转述树立和践行正确政绩观学习教育）", "src": ""}, {"id": "c3a82296b1", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["担当"], "text": "全面从严治党，绝非束缚干事手脚，而是通过明方向、立规矩、正风气、强免疫，营造积极健康、干事创业的政治生态。", "src": "同上"}, {"id": "c75bae2737", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["担当"], "text": "想干事者有舞台，能干事者有底气，干成事者有荣光。", "src": "同上"}, {"id": "52a7c5591c", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "事在四方，要在中央。（任仲平，2026年10月26日 01 版）", "src": ""}, {"id": "be16299df3", "date": "2026-10-27", "type": "短语", "big": "政绩观·党性修养", "topics": ["党性修养"], "text": "理论强，才能方向明、人心齐、底气足。", "src": "同上"}, {"id": "03d6734a24", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作"], "text": "对老百姓来说，他们身边每一件琐碎的小事，都是实实在在的大事。（习近平《之江新语》，转引自《把握好基层工作的&quot;大&quot;与&quot;小&quot;（思想纵横）》，2026年10月26日 09 版）", "src": ""}, {"id": "17e1a4d6a9", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["基层治理"], "text": "基层是国家治理体系的&quot;神经末梢&quot;，一头承载着党和国家的战略大局，一头连着千家万户的民生小事。", "src": "同上"}, {"id": "71b1b4d9b0", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作"], "text": "你与群众有多近，群众对你就有多亲。", "src": "01 版述评"}, {"id": "eb86b3e330", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上"], "text": "一餐一饭，关乎民生冷暖，关系人心向背。", "src": "任仲平"}, {"id": "c80276ce3c", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["人民至上"], "text": "人民群众反对什么、痛恨什么，我们就要坚决防范和纠正什么。", "src": "习近平，转引自任仲平"}, {"id": "b53d38bc34", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["民生保障"], "text": "我国受访民众对自身获得感、幸福感、安全感的认同比例均超92%。", "src": "任仲平引调查结果"}, {"id": "9803ba8b79", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["基层治理"], "text": "从新时代&quot;枫桥经验&quot;推动矛盾化解在基层、消弭于萌芽，到&quot;六尺巷工作法&quot;以&quot;让他三尺&quot;的和合智慧浸润邻里。", "src": "任仲平"}, {"id": "787a0e0d05", "date": "2026-10-27", "type": "短语", "big": "为民·民生·基层", "topics": ["群众工作"], "text": "民心是最大的政治。一个政党，一个政权，其前途和命运最终取决于人心向背。", "src": "01 版述评"}, {"id": "289515463d", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["技能人才"], "text": "打破固有学制壁垒，让技能人才成长有通道、上升有空间。（《贯通培养，成才之路更多元（新知）》，2026年10月26日 05 版）", "src": ""}, {"id": "097386928b", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["教育"], "text": "教育是为了让不同的孩子在适合自己的赛道上成长成才。", "src": "同上"}, {"id": "9f27841328", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["教育"], "text": "办好不同类型的教育，畅通多元成才路径，让每条路都通向出彩的人生。", "src": "同上"}, {"id": "4c38527b74", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新"], "text": "关键不是&quot;买专利&quot;，而是投资一条从科研发现走向临床和市场的完整链条，打通从基础研究到产业落地的转化堵点。（《让医药知识产权成长为现实生产力（专家点评）》，2026年10月26日 02 版）", "src": ""}, {"id": "7ddaed667c", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["科技创新"], "text": "知识产权投资应更注重投早、投小、投长期、投硬科技。", "src": "同上"}, {"id": "71e7a0dd27", "date": "2026-10-27", "type": "短语", "big": "创新·人才·教育", "topics": ["自立自强"], "text": "我国社会主义制度能够集中力量办大事是我们成就事业的重要法宝。", "src": "习近平，转引自任仲平"}, {"id": "e5bdcdc682", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["营商环境"], "text": "账款拖欠，看似是资金往来出现&quot;时差&quot;，实则是契约精神的慢性流失。（《促每笔账款按约兑现（人民时评）》，2026年10月26日 05 版）", "src": ""}, {"id": "56305bdf13", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["营商环境"], "text": "守约得到鼓励，违约受到惩戒，交易各方才更有动力自觉履约。", "src": "同上"}, {"id": "53fcb25030", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["营商环境"], "text": "事后清欠是&quot;止血&quot;，源头守约才是&quot;固本&quot;。", "src": "同上"}, {"id": "c4d395558e", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["营商环境"], "text": "各级政府和国有企业，理应在清欠上带好头、作表率，助力构建良好营商环境。", "src": "同上"}, {"id": "6d714ceba9", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["新质生产力"], "text": "从&quot;三头在外&quot;到&quot;4个第一&quot;，中国新能源产业的逆袭，答案就藏在新时代全面从严治党的实践里。", "src": "《锻造&quot;实现愿景的非凡能力&quot;》，05 版"}, {"id": "c22e73f0bb", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["高质量发展"], "text": "把各方面资源汇集起来、力量凝聚起来，我们的制度优势加快转化为发展胜势。", "src": "同上"}, {"id": "c8f0eca085", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育"], "text": "推动历史经典产业高质量发展，是激发全民族文化创新创造活力、提升国家文化软实力的重要举措。（《推动历史经典产业高质量发展（专题深思）》，2026年10月26日 09 版）", "src": ""}, {"id": "9af2c99505", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育"], "text": "构建&quot;文化挖掘—品牌建设—人才培育&quot;三位一体支撑体系。", "src": "同上"}, {"id": "13ed96b41c", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育"], "text": "形成龙头引领、配套联动、梯队递进的良好产业生态。", "src": "同上"}, {"id": "7c4655c151", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["产业培育"], "text": "消费者不再满足于消费品的功能价值，更加追求其蕴含的文化底蕴、独特审美、情感共鸣等精神价值。", "src": "同上"}, {"id": "88516dcbe9", "date": "2026-10-27", "type": "短语", "big": "高质量发展·产业", "topics": ["数字经济"], "text": "要发挥清洁能源优势，坚持以电促算、以算调电、算电融合。", "src": "甘肃省委常委会会议，2026年10月21日"}, {"id": "edf1947463", "date": "2026-10-27", "type": "短语", "big": "生态文明·绿色发展", "topics": ["能源转型"], "text": "深入实施能源安全新战略，加快构建清洁低碳安全高效的新型能源体系，建设能源强国。（&quot;十五五&quot;规划纲要，转引自任仲平）", "src": ""}, {"id": "fe5bc80274", "date": "2026-10-27", "type": "短语", "big": "生态文明·绿色发展", "topics": ["能源转型"], "text": "截至7月底，我国光伏发电装机首超煤电，成为装机规模最大的电源品类。", "src": "任仲平"}, {"id": "c2ae1125c1", "date": "2026-10-27", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展"], "text": "深入推进能源革命，一张蓝图绘到底、一步一步向前进。", "src": "《锻造&quot;实现愿景的非凡能力&quot;》，05 版"}, {"id": "37fc58e186", "date": "2026-10-27", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展"], "text": "党带领人民将宏伟蓝图一步步变成美好现实，书写了绿色转型的精彩答卷。", "src": "同上"}, {"id": "144a3356a7", "date": "2026-10-27", "type": "短语", "big": "生态文明·绿色发展", "topics": ["生态文明"], "text": "扎实推进黄河流域生态保护和高质量发展，不断巩固祁连山生态环境保护成果，坚决打好&quot;三北&quot;工程攻坚战。", "src": "甘肃省委常委会会议，2026年10月21日"}, {"id": "28863e96a2", "date": "2026-10-27", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展"], "text": "整改整治是一堂深刻的思想政治课，当地党员干部自觉当好&quot;中华水塔&quot;守护人。（01 版述评，青海木里矿区）", "src": ""}, {"id": "444abb34b3", "date": "2026-10-27", "type": "短语", "big": "生态文明·绿色发展", "topics": ["双碳"], "text": "&quot;十四五&quot;时期，中国出口的风电光伏产品累计为其他国家减少碳排放约41亿吨。", "src": "任仲平"}, {"id": "82f5b88602", "date": "2026-10-27", "type": "短语", "big": "生态文明·绿色发展", "topics": ["绿色发展"], "text": "全面加快经济社会绿色低碳转型，坚定不移走生态优先、绿色发展之路。", "src": "甘肃省委常委会会议，2026年10月21日"}, {"id": "22b57cf234", "date": "2026-10-27", "type": "短语", "big": "治理·法治·安全", "topics": ["治理精度"], "text": "村中道路好不好走、门前路灯亮不亮，这些看似零散细碎的&quot;小问题&quot;，正是群众感受为民温度的直接窗口，也是检验治理成色的试金石。", "src": "09 版思想纵横"}, {"id": "bc0b8e3f6c", "date": "2026-10-27", "type": "短语", "big": "治理·法治·安全", "topics": ["治理精度"], "text": "基层处理的事务虽小，责任却是千钧重。", "src": "同上"}, {"id": "bace078eda", "date": "2026-10-27", "type": "短语", "big": "治理·法治·安全", "topics": ["法治"], "text": "以法治为引领，以综治为抓手，持续化解账款拖欠问题，有益于为经济循环&quot;活血化瘀&quot;。", "src": "《促每笔账款按约兑现》，05 版"}, {"id": "c8f451ecb2", "date": "2026-10-27", "type": "短语", "big": "治理·法治·安全", "topics": ["法治"], "text": "把债权保障上升为刚性法治准则，有助于从根本上规范付款行为。", "src": "同上"}, {"id": "dacbbb2e5a", "date": "2026-10-27", "type": "短语", "big": "治理·法治·安全", "topics": ["安全观"], "text": "&quot;平安&quot;是&quot;中国之治&quot;的显著标志，让&quot;平安中国&quot;成为一张亮眼的&quot;国家名片&quot;。", "src": "任仲平"}, {"id": "1ebe2a8ab2", "date": "2026-10-27", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信"], "text": "文化自信，是更基础、更广泛、更深厚的自信，是更基本、更深沉、更持久的力量。（习近平，转引自《文化自信何以强（评论员观察）》，2026年10月26日 05 版）", "src": ""}, {"id": "5ae73c367d", "date": "2026-10-27", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信"], "text": "文化自信并不意味着唯我独尊或故步自封，而是以开放心态、包容姿态拥抱多元文化、多彩文明。", "src": "《文化自信何以强》，05 版"}, {"id": "122d64eefe", "date": "2026-10-27", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信"], "text": "有了文化主体性，就有了文化意义上坚定的自我，文化自信就有了根本依托。", "src": "习近平，同上"}, {"id": "5d83881667", "date": "2026-10-27", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信"], "text": "今日之中国，文化自信如海如山，展现&quot;越自信、越开放，越开放、越自信&quot;的气度与胸怀。", "src": "同上"}, {"id": "1857e7f550", "date": "2026-10-27", "type": "短语", "big": "文化·精神·文明", "topics": ["文化自信"], "text": "立足自身、兼纳八方，我们得以将价值标尺握在自己手中。", "src": "同上"}, {"id": "a279f0dbe3", "date": "2026-10-27", "type": "短语", "big": "文化·精神·文明", "topics": ["价值观"], "text": "国家蒸蒸日上、民族走向复兴，文化主体性不断巩固，我们得以&quot;平视世界&quot;。", "src": "《文化自信何以强》，05 版"}, {"id": "031a681863", "date": "2026-10-27", "type": "短语", "big": "文化·精神·文明", "topics": ["传统文化"], "text": "当红色文化可感可知、可触可及、可亲可近，红色教育便从单向输出转向互动体验。（《让红色文物与当下对话（专家点评）》，2026年10月26日 06 版）", "src": ""}, {"id": "61bf56904d", "date": "2026-10-27", "type": "短语", "big": "文化·精神·文明", "topics": ["精神文明"], "text": "奋斗未有穷期，赶考未有穷期。", "src": "任仲平，《人民日报》2026年10月26日 01 版"}];
var BIG_ORDER = ["政绩观·党性修养", "为民·民生·基层", "创新·人才·教育", "高质量发展·产业", "生态文明·绿色发展", "治理·法治·安全", "文化·精神·文明", "开放·合作·全球治理", "方法论·万能句", "政治民生", "文化", "乡村振兴", "行政执法", "生态", "科技", "经济", "背景句", "过渡句", "人生哲理", "其他·待归类"];
var USED = {};
try { USED = JSON.parse(localStorage.getItem('rv_used') || '{}'); } catch (e) { USED = {}; }
function save() { try { localStorage.setItem('rv_used', JSON.stringify(USED)); } catch (e) {} }
var topic = '__all__', onlyUnused = false, kw = '', drawMode = false, drawIds = [];

function esc(s){return s;}
function el(id){return document.getElementById(id);}

function bigList() {
  var m = {};
  DATA.forEach(function (d) {
    if (!m[d.big]) m[d.big] = { t: 0, u: 0 };
    m[d.big].t++;
    if (!USED[d.id]) m[d.big].u++;
  });
  var a = [];
  BIG_ORDER.forEach(function (b) { if (m[b]) a.push([b, m[b].u, m[b].t]); });
  Object.keys(m).forEach(function (k) { if (BIG_ORDER.indexOf(k) < 0) a.push([k, m[k].u, m[k].t]); });
  return a;
}
function renderChips() {
  var un = DATA.filter(function (d) { return !USED[d.id]; }).length;
  var h = '<div class="chip' + (topic === '__all__' ? ' on' : '') + '" onclick="setTopic(\'__all__\')">全部<i>' + un + '/' + DATA.length + '</i></div>';
  bigList().forEach(function (p) {
    h += '<div class="chip' + (topic === p[0] ? ' on' : '') + '" onclick="setTopic(\'' + p[0].replace(/'/g, '') + '\')">' + p[0] + '<i>' + p[1] + '/' + p[2] + '</i></div>';
  });
  el('chips').innerHTML = h;
}
function setTopic(t) { topic = t; drawMode = false; render(); }
function setUnused(b) { onlyUnused = b; el('bu').className = 'btn' + (b ? ' on' : ''); drawMode = false; render(); }
function setKw(v) { kw = v.trim(); drawMode = false; render(); }
function toggle(id) {
  if (USED[id]) delete USED[id]; else USED[id] = 1;
  save(); render();
}
function match(d) {
  if (topic !== '__all__' && d.big !== topic) return false;
  if (onlyUnused && USED[d.id]) return false;
  if (kw && d.text.indexOf(kw) < 0 && d.topics.join('').indexOf(kw) < 0 && d.big.indexOf(kw) < 0) return false;
  return true;
}
function say(btn, txt) {
  if (!('speechSynthesis' in window)) { btn.textContent = '不支持'; return; }
  if (window.__spk === btn) { window.speechSynthesis.cancel(); btn.textContent = '🔊'; window.__spk = null; return; }
  window.speechSynthesis.cancel();
  if (window.__spk) window.__spk.textContent = '🔊';
  var u = new SpeechSynthesisUtterance(txt);
  u.lang = 'zh-CN'; u.rate = 0.92;
  u.onend = function () { btn.textContent = '🔊'; window.__spk = null; };
  btn.textContent = '■'; window.__spk = btn;
  window.speechSynthesis.speak(u);
}
function draw() {
  var pool = DATA.filter(function (d) { return match(d) && !USED[d.id]; });
  if (pool.length === 0) { alert('当前筛选下没有未用过的句子'); return; }
  pool.sort(function () { return Math.random() - 0.5; });
  drawIds = pool.slice(0, 5).map(function (d) { return d.id; });
  drawMode = true; render();
  window.scrollTo(0, 0);
}
function stat() {
  var u = 0, w = 0;
  var today = new Date();
  DATA.forEach(function (d) {
    if (USED[d.id]) u++;
    var dd = new Date(d.date);
    if ((today - dd) / 86400000 <= 7) w++;
  });
  el('s1').textContent = DATA.length;
  el('s2').textContent = u;
  el('s3').textContent = DATA.length - u;
  el('s4').textContent = w;
}
function render() {
  stat(); renderChips();
  var list = DATA.filter(function (d) { return drawMode ? drawIds.indexOf(d.id) >= 0 : match(d); });
  var h = '';
  list.forEach(function (d) {
    var tg = '<span class="tag big">' + d.big + '</span>'
      + d.topics.map(function (t) { return '<span class="tag sm">' + t + '</span>'; }).join('');
    h += '<div class="it' + (USED[d.id] ? ' used' : '') + (d.type === '短语' ? ' phrase' : '') + '">'
      + '<div class="tx">' + d.text + '</div><div class="mt">' + tg
      + '<span class="dt">' + d.date.slice(5) + ' · ' + d.type + '</span>'
      + (d.src ? '<span class="src">' + d.src + '</span>' : '')
      + '<button class="ibtn say" onclick="say(this, this.parentNode.parentNode.querySelector(\'.tx\').innerText)">🔊</button>'
      + '<button class="ibtn' + (USED[d.id] ? ' on' : '') + '" onclick="toggle(\'' + d.id + '\')">'
      + (USED[d.id] ? '已用过 ✓' : '标为已用') + '</button></div></div>';
  });
  if (!h) h = '<div class="empty">没有符合条件的句子</div>';
  el('list').innerHTML = h;
  el('cnt').textContent = list.length;
  el('draw').style.display = drawMode ? 'block' : 'none';
  el('dbtn').textContent = drawMode ? '退出抽签' : '随机抽 5 句';
}
function exportUsed() {
  var blob = new Blob([JSON.stringify({ used: USED, at: new Date().toISOString() }, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '摘抄已用清单.json';
  a.click();
}
function importUsed(inp) {
  var f = inp.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var o = JSON.parse(r.result);
      USED = o.used || o;
      save(); render(); alert('已恢复 ' + Object.keys(USED).length + ' 条标记');
    } catch (e) { alert('文件格式不对'); }
  };
  r.readAsText(f);
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('../sw.js').catch(function () {}); });
}
render();
</script>
